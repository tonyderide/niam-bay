<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Apprends le code moto (épreuve théorique moto - ETM) simplement : cours par thème, quiz et examens blancs." />
  <title>Code Moto 🏍️ — Apprends l'épreuve théorique moto</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏍️</text></svg>" />
  <style>
:root {
  --bg: #0f172a;
  --bg-soft: #1e293b;
  --card: #1e293b;
  --card-hover: #334155;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --primary: #f97316;
  --primary-dark: #ea580c;
  --green: #22c55e;
  --green-bg: rgba(34, 197, 94, 0.15);
  --red: #ef4444;
  --red-bg: rgba(239, 68, 68, 0.15);
  --border: #334155;
  --radius: 16px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  min-height: 100%;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Top bar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}

.brand {
  font-size: 20px;
  margin: 0;
  flex: 1;
  cursor: pointer;
  user-select: none;
}

.streak {
  font-size: 14px;
  font-weight: 700;
  background: var(--bg-soft);
  border: 1px solid var(--border);
  padding: 6px 10px;
  border-radius: 999px;
}

.icon-btn {
  background: var(--bg-soft);
  border: 1px solid var(--border);
  color: var(--text);
  width: 38px;
  height: 38px;
  border-radius: 10px;
  font-size: 20px;
  cursor: pointer;
}

.icon-btn:active { transform: scale(0.95); }

/* Main */
main {
  flex: 1;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 20px 16px 40px;
}

.footer {
  text-align: center;
  padding: 18px 16px 28px;
  color: var(--muted);
  font-size: 13px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}

.link-btn {
  background: none;
  border: none;
  color: var(--muted);
  text-decoration: underline;
  cursor: pointer;
  font-size: 13px;
}

.hidden { display: none !important; }

/* Hero / home */
.hero {
  text-align: center;
  margin-bottom: 24px;
}
.hero h2 {
  font-size: 26px;
  margin: 0 0 6px;
}
.hero p {
  color: var(--muted);
  margin: 0;
}

/* Mode cards */
.mode-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  margin-bottom: 26px;
}
@media (min-width: 540px) {
  .mode-grid { grid-template-columns: 1fr 1fr; }
}

.mode-card {
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: left;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  cursor: pointer;
  transition: transform 0.12s, border-color 0.12s, background 0.12s;
  color: var(--text);
  width: 100%;
}
.mode-card:hover { background: var(--card-hover); border-color: var(--primary); }
.mode-card:active { transform: scale(0.98); }
.mode-card .emoji { font-size: 32px; }
.mode-card .mc-title { font-weight: 700; font-size: 16px; }
.mode-card .mc-desc { color: var(--muted); font-size: 13px; margin-top: 2px; }

/* Section title */
.section-title {
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 24px 0 12px;
}

/* Theme list */
.theme-list { display: flex; flex-direction: column; gap: 10px; }
.theme-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  cursor: pointer;
  color: var(--text);
  width: 100%;
  text-align: left;
}
.theme-row:hover { border-color: var(--primary); }
.theme-row .t-emoji { font-size: 24px; }
.theme-row .t-name { flex: 1; font-weight: 600; }
.theme-row .t-count { color: var(--muted); font-size: 13px; }
.theme-row .t-bar {
  width: 100%;
  height: 6px;
  background: var(--bg);
  border-radius: 999px;
  margin-top: 6px;
  overflow: hidden;
}
.theme-row .t-bar > span { display: block; height: 100%; background: var(--green); }
.theme-row .t-info { flex: 1; }

/* Stats */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 18px 0;
}
.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  text-align: center;
}
.stat .num { font-size: 22px; font-weight: 800; }
.stat .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* Quiz */
.quiz-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  font-size: 14px;
  color: var(--muted);
}
.progress {
  height: 8px;
  background: var(--bg-soft);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 20px;
}
.progress > span { display: block; height: 100%; background: var(--primary); transition: width 0.3s; }

.q-theme-tag {
  display: inline-block;
  font-size: 12px;
  color: var(--primary);
  background: rgba(249, 115, 22, 0.12);
  border: 1px solid rgba(249, 115, 22, 0.3);
  padding: 4px 10px;
  border-radius: 999px;
  margin-bottom: 12px;
}

.q-illu {
  font-size: 64px;
  text-align: center;
  margin: 6px 0 14px;
}

.q-text {
  font-size: 20px;
  font-weight: 700;
  line-height: 1.35;
  margin: 0 0 6px;
}
.q-hint { color: var(--muted); font-size: 13px; margin: 0 0 18px; }

.answers { display: flex; flex-direction: column; gap: 10px; }

.answer {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 15px 16px;
  cursor: pointer;
  font-size: 16px;
  text-align: left;
  color: var(--text);
  transition: border-color 0.12s, background 0.12s;
  width: 100%;
}
.answer:hover { border-color: var(--primary); }
.answer .marker {
  width: 26px;
  height: 26px;
  flex: 0 0 26px;
  border-radius: 8px;
  border: 2px solid var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
}
.answer.selected { border-color: var(--primary); }
.answer.selected .marker { background: var(--primary); border-color: var(--primary); color: #fff; }

.answer.correct { border-color: var(--green); background: var(--green-bg); }
.answer.correct .marker { background: var(--green); border-color: var(--green); color: #fff; }
.answer.wrong { border-color: var(--red); background: var(--red-bg); }
.answer.wrong .marker { background: var(--red); border-color: var(--red); color: #fff; }
.answer:disabled { cursor: default; }

/* Explanation */
.explain {
  margin-top: 18px;
  border-radius: 14px;
  padding: 16px;
  border: 1px solid var(--border);
  background: var(--bg-soft);
}
.explain.good { border-color: var(--green); }
.explain.bad { border-color: var(--red); }
.explain .verdict { font-weight: 800; margin-bottom: 6px; }
.explain .verdict.good { color: var(--green); }
.explain .verdict.bad { color: var(--red); }
.explain p { margin: 0; color: var(--text); line-height: 1.45; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 14px;
  padding: 16px 22px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
  margin-top: 18px;
  transition: background 0.12s, transform 0.1s;
}
.btn:hover { background: var(--primary-dark); }
.btn:active { transform: scale(0.99); }
.btn.secondary { background: var(--bg-soft); border: 1px solid var(--border); color: var(--text); }
.btn.secondary:hover { background: var(--card-hover); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-row { display: flex; gap: 10px; }
.btn-row .btn { margin-top: 0; }

/* Result */
.result { text-align: center; padding: 10px 0; }
.result .big-emoji { font-size: 72px; }
.result h2 { font-size: 26px; margin: 10px 0 4px; }
.result .score-line { font-size: 18px; color: var(--muted); margin-bottom: 4px; }
.result .ring {
  --p: 0;
  width: 160px; height: 160px;
  border-radius: 50%;
  margin: 16px auto;
  background: conic-gradient(var(--green) calc(var(--p) * 1%), var(--bg-soft) 0);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.result .ring::before {
  content: "";
  position: absolute;
  inset: 14px;
  background: var(--bg);
  border-radius: 50%;
}
.result .ring .pct { position: relative; font-size: 34px; font-weight: 800; }

.review-item {
  text-align: left;
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--red);
  border-radius: 10px;
  padding: 12px 14px;
  margin-top: 10px;
  font-size: 14px;
}
.review-item .ri-q { font-weight: 700; margin-bottom: 4px; }
.review-item .ri-a { color: var(--green); }
.review-item.ok { border-left-color: var(--green); }

.empty {
  text-align: center;
  color: var(--muted);
  padding: 40px 20px;
}
.empty .big-emoji { font-size: 56px; }

.fade-in { animation: fade 0.25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

</style>
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn hidden" aria-label="Retour">←</button>
    <h1 class="brand" id="brandBtn">🏍️ Code Moto</h1>
    <div class="streak" id="streakBadge" title="Série de bonnes réponses">🔥 0</div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <span>Pour réviser l'épreuve théorique moto (ETM)</span>
    <button id="resetBtn" class="link-btn">Réinitialiser ma progression</button>
  </footer>

  <script>
/* =====================================================================
   Code Moto — Banque de questions (ETM : épreuve théorique moto)
   ---------------------------------------------------------------------
   Chaque question :
   { id, theme, q, illu, multi, answers:[{t, ok}], explain }
   - theme   : clé d'un thème défini dans THEMES
   - illu    : emoji d'illustration (facultatif)
   - multi   : true si plusieurs bonnes réponses
   - answers : ok=true pour les bonnes réponses
   - explain : explication affichée après la réponse
   ===================================================================== */

const THEMES = [
  { key: "equipement",     emoji: "🦺", name: "Équipement & protection" },
  { key: "signalisation",  emoji: "🚸", name: "Signalisation & panneaux" },
  { key: "reglementation", emoji: "📋", name: "Réglementation & vitesses" },
  { key: "securite",       emoji: "⚠️", name: "Sécurité & dangers" },
  { key: "conduite",       emoji: "🛣️", name: "Conduite & trajectoire" },
  { key: "mecanique",      emoji: "🔧", name: "Mécanique & entretien" },
  { key: "secours",        emoji: "🚑", name: "Premiers secours" },
  { key: "environnement",  emoji: "🌿", name: "Environnement & partage" },
];

const QUESTIONS = [
  /* ---------------- ÉQUIPEMENT & PROTECTION ---------------- */
  {
    id: 1, theme: "equipement", illu: "🪖", multi: false,
    q: "Le casque est-il obligatoire à moto ?",
    answers: [
      { t: "Oui, pour le conducteur et le passager", ok: true },
      { t: "Oui, mais seulement pour le conducteur", ok: false },
      { t: "Non, il est seulement conseillé", ok: false },
    ],
    explain: "Le casque homologué et attaché est obligatoire pour le conducteur ET le passager. Sans casque : 3 points en moins et une amende.",
  },
  {
    id: 2, theme: "equipement", illu: "🧤", multi: false,
    q: "Les gants sont-ils obligatoires à moto ?",
    answers: [
      { t: "Oui, des gants certifiés CE, pour le conducteur et le passager", ok: true },
      { t: "Non, ils sont facultatifs", ok: false },
      { t: "Seulement en hiver", ok: false },
    ],
    explain: "Depuis le 20 novembre 2016, des gants certifiés CE sont obligatoires pour le conducteur et le passager. Sans gants : amende de 68 € et 1 point en moins.",
  },
  {
    id: 3, theme: "equipement", illu: "🦺", multi: false,
    q: "Le gilet de haute visibilité à moto…",
    answers: [
      { t: "doit être à bord et porté en cas d'arrêt d'urgence", ok: true },
      { t: "doit être porté en permanence sur la moto", ok: false },
      { t: "n'est pas nécessaire à moto", ok: false },
    ],
    explain: "Tout motard doit avoir un gilet rétro-réfléchissant à portée de main et le mettre en cas d'arrêt d'urgence (sur la chaussée ou sur l'accotement).",
  },
  {
    id: 4, theme: "equipement", illu: "👕", multi: true,
    q: "Quels équipements protègent réellement en cas de chute ? (plusieurs réponses)",
    answers: [
      { t: "Un blouson avec coques aux coudes et aux épaules", ok: true },
      { t: "Des bottes ou chaussures montantes", ok: true },
      { t: "Un pantalon renforcé", ok: true },
      { t: "Un simple t-shirt et un short", ok: false },
    ],
    explain: "Le bon réflexe : s'équiper de la tête aux pieds (casque, gants, blouson à coques, pantalon renforcé, bottes). On dit « s'habiller pour la chute, pas pour le trajet ».",
  },
  {
    id: 5, theme: "equipement", illu: "🪖", multi: false,
    q: "À quoi reconnaît-on un casque homologué pour la route ?",
    answers: [
      { t: "À son étiquette de homologation (norme ECE) cousue à la jugulaire", ok: true },
      { t: "À sa couleur", ok: false },
      { t: "À sa marque uniquement", ok: false },
    ],
    explain: "Un casque routier porte une étiquette d'homologation (norme ECE 22-05 ou 22-06). Les casques « jet » sans homologation ou de chantier sont interdits sur la route.",
  },
  {
    id: 6, theme: "equipement", illu: "👁️", multi: false,
    q: "La visière ou les lunettes de protection servent surtout à…",
    answers: [
      { t: "protéger les yeux du vent, des insectes et des projections", ok: true },
      { t: "faire joli", ok: false },
      { t: "rien, on peut rouler les yeux nus à toute vitesse", ok: false },
    ],
    explain: "Une protection des yeux (visière homologuée ou lunettes) est indispensable : à vitesse élevée, un insecte ou un gravillon peut faire perdre le contrôle.",
  },

  /* ---------------- SIGNALISATION & PANNEAUX ---------------- */
  {
    id: 7, theme: "signalisation", illu: "🛑", multi: false,
    q: "Devant un panneau STOP, vous devez…",
    answers: [
      { t: "marquer un arrêt complet, même si la route est dégagée", ok: true },
      { t: "ralentir fortement sans forcément vous arrêter", ok: false },
      { t: "vous arrêter seulement si un véhicule arrive", ok: false },
    ],
    explain: "Le STOP impose un arrêt total (roues immobiles) à la limite de la chaussée, puis de céder le passage. Ne pas s'arrêter = 4 points en moins.",
  },
  {
    id: 8, theme: "signalisation", illu: "🔺", multi: false,
    q: "Un panneau triangulaire à bord rouge annonce généralement…",
    answers: [
      { t: "un danger", ok: true },
      { t: "une obligation", ok: false },
      { t: "une interdiction", ok: false },
    ],
    explain: "Les panneaux triangulaires à bord rouge signalent un danger. Les ronds rouges interdisent, les ronds bleus obligent, les carrés bleus informent.",
  },
  {
    id: 9, theme: "signalisation", illu: "⭕", multi: false,
    q: "Un panneau rond entièrement bleu indique…",
    answers: [
      { t: "une obligation", ok: true },
      { t: "un danger", ok: false },
      { t: "une fin d'interdiction", ok: false },
    ],
    explain: "Les panneaux ronds bleus indiquent une obligation (sens obligatoire, piste cyclable obligatoire, vitesse minimale…).",
  },
  {
    id: 10, theme: "signalisation", illu: "🚦", multi: false,
    q: "À un feu orange (jaune) fixe, vous devez…",
    answers: [
      { t: "vous arrêter si vous pouvez le faire en sécurité", ok: true },
      { t: "toujours accélérer pour passer", ok: false },
      { t: "klaxonner et passer", ok: false },
    ],
    explain: "Le feu orange impose l'arrêt, sauf si le véhicule est trop engagé pour s'arrêter sans risque (freinage brutal dangereux, surtout à moto).",
  },
  {
    id: 11, theme: "signalisation", illu: "🚲", multi: false,
    q: "Une ligne blanche continue au milieu de la route signifie…",
    answers: [
      { t: "interdiction de la franchir ou de la chevaucher", ok: true },
      { t: "qu'on peut doubler si la voie est libre", ok: false },
      { t: "qu'elle sépare seulement les sens de circulation sans règle", ok: false },
    ],
    explain: "Une ligne continue ne doit jamais être franchie ni chevauchée. La franchir = 3 points en moins et une amende.",
  },
  {
    id: 12, theme: "signalisation", illu: "🅿️", multi: false,
    q: "Un panneau rond rouge avec une moto barrée signifie…",
    answers: [
      { t: "accès interdit aux motos", ok: true },
      { t: "parking réservé aux motos", ok: false },
      { t: "zone de prudence pour les motos", ok: false },
    ],
    explain: "Un panneau d'interdiction (rond à bord rouge) avec une moto signifie que la circulation des motos y est interdite.",
  },
  {
    id: 13, theme: "signalisation", illu: "↩️", multi: false,
    q: "Le marquage au sol « zébra » (hachures) au sol…",
    answers: [
      { t: "ne doit pas être emprunté ni franchi", ok: true },
      { t: "est une zone de stationnement pour motos", ok: false },
      { t: "sert à doubler plus facilement", ok: false },
    ],
    explain: "Les zébras (hachures) délimitent une zone interdite à la circulation, destinée à séparer ou guider le trafic. On ne roule pas dessus.",
  },

  /* ---------------- RÉGLEMENTATION & VITESSES ---------------- */
  {
    id: 14, theme: "reglementation", illu: "🏙️", multi: false,
    q: "En agglomération, la vitesse maximale par défaut est de…",
    answers: [
      { t: "50 km/h", ok: true },
      { t: "30 km/h", ok: false },
      { t: "70 km/h", ok: false },
    ],
    explain: "En ville, la limite par défaut est 50 km/h, parfois abaissée à 30 km/h dans certaines zones. Toujours respecter la signalisation locale.",
  },
  {
    id: 15, theme: "reglementation", illu: "🛣️", multi: false,
    q: "Sur une route à double sens sans séparateur central, la vitesse est généralement de…",
    answers: [
      { t: "80 km/h (parfois 90 km/h selon le département)", ok: true },
      { t: "110 km/h", ok: false },
      { t: "130 km/h", ok: false },
    ],
    explain: "Hors agglomération, sur ces routes la limite est de 80 km/h, relevée à 90 km/h sur certains axes par décision départementale.",
  },
  {
    id: 16, theme: "reglementation", illu: "🌧️", multi: false,
    q: "Sur autoroute, la vitesse maximale par temps de pluie est de…",
    answers: [
      { t: "110 km/h", ok: true },
      { t: "130 km/h", ok: false },
      { t: "90 km/h", ok: false },
    ],
    explain: "Sur autoroute : 130 km/h par temps sec, mais 110 km/h en cas de pluie. Sur voie rapide, on passe de 110 à 100 km/h.",
  },
  {
    id: 17, theme: "reglementation", illu: "🍺", multi: false,
    q: "Le taux d'alcool maximal autorisé pour un conducteur en permis probatoire (jeune permis) est de…",
    answers: [
      { t: "0,2 g/L de sang", ok: true },
      { t: "0,5 g/L de sang", ok: false },
      { t: "0,8 g/L de sang", ok: false },
    ],
    explain: "En permis probatoire, la limite est de 0,2 g/L (quasi zéro). Pour les autres conducteurs, c'est 0,5 g/L. À moto, l'alcool est un facteur majeur d'accidents.",
  },
  {
    id: 18, theme: "reglementation", illu: "🆔", multi: false,
    q: "Le permis A2 limite la puissance de la moto à…",
    answers: [
      { t: "35 kW (47,5 ch) maximum", ok: true },
      { t: "100 kW", ok: false },
      { t: "aucune limite", ok: false },
    ],
    explain: "Le permis A2 (dès 18 ans) limite à 35 kW (47,5 ch). Après 2 ans en A2 et une formation de 7 h, on accède au permis A (toutes cylindrées).",
  },
  {
    id: 19, theme: "reglementation", illu: "🛵", multi: false,
    q: "Avec un permis B (voiture), peut-on conduire un 125 cm³ ?",

      { t: "améliorer votre visibilité, surtout de nuit et par mauvais temps", ok: true },
      { t: "rien, c'est purement décoratif", ok: false },
      { t: "remplacer les feux de la moto", ok: false },
    ],
    explain: "Bandes réfléchissantes, couleurs vives, gilet : tout ce qui vous rend visible réduit le risque d'accident. Le motard discret est le motard en danger.",
  },
];

// Exposition globale (chargé avant app.js)
window.THEMES = THEMES;
window.QUESTIONS = QUESTIONS;

</script>
<script>
/* =====================================================================
   Code Moto — Logique de l'application (vanilla JS, sans dépendance)
   ===================================================================== */

(function () {
  "use strict";

  const THEMES = window.THEMES;
  const QUESTIONS = window.QUESTIONS;
  const STORE_KEY = "codemoto:v1";

  const app = document.getElementById("app");
  const backBtn = document.getElementById("backBtn");
  const brandBtn = document.getElementById("brandBtn");
  const streakBadge = document.getElementById("streakBadge");
  const resetBtn = document.getElementById("resetBtn");

  /* ----------------------- Stockage local ----------------------- */
  function loadStore() {
    try {
      return JSON.parse(localStorage.getItem(STORE_KEY)) || {};
    } catch (e) {
      return {};
    }
  }
  function saveStore(s) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
  }
  let store = loadStore();
  store.seen = store.seen || {};        // id -> true si correctement répondu au moins une fois
  store.mistakes = store.mistakes || {}; // id -> true si déjà raté
  store.streak = store.streak || 0;
  store.bestExam = store.bestExam || 0;
  store.examsDone = store.examsDone || 0;

  function persist() { saveStore(store); }

  /* ----------------------- Utilitaires ----------------------- */
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function byTheme(key) { return QUESTIONS.filter((q) => q.theme === key); }
  function themeMeta(key) { return THEMES.find((t) => t.key === key); }
  function updateStreakBadge() { streakBadge.textContent = "🔥 " + store.streak; }

  /* ----------------------- Navigation ----------------------- */
  let onBack = null;
  function setBack(fn) {
    onBack = fn;
    backBtn.classList.toggle("hidden", !fn);
  }
  backBtn.addEventListener("click", () => { if (onBack) onBack(); });
  brandBtn.addEventListener("click", renderHome);
  resetBtn.addEventListener("click", () => {
    if (confirm("Réinitialiser toute ta progression (questions vues, erreurs, score) ?")) {
      store = { seen: {}, mistakes: {}, streak: 0, bestExam: 0, examsDone: 0 };
      persist();
      updateStreakBadge();
      renderHome();
    }
  });

  /* ----------------------- Écran d'accueil ----------------------- */
  function renderHome() {
    setBack(null);
    updateStreakBadge();

    const totalQ = QUESTIONS.length;
    const seenCount = Object.keys(store.seen).length;
    const mistakeCount = Object.keys(store.mistakes).length;

    const modes = [
      { emoji: "📚", title: "Apprendre par thème", desc: "Réviser tranquillement, thème par thème", act: renderThemes },
      { emoji: "⚡", title: "Quiz rapide", desc: "10 questions au hasard", act: () => startQuiz(pickRandom(10), "Quiz rapide") },
      { emoji: "📝", title: "Examen blanc", desc: "40 questions comme à l'épreuve", act: () => startQuiz(pickRandom(40), "Examen blanc", true) },
      { emoji: "🔁", title: "Mes erreurs", desc: mistakeCount ? mistakeCount + " question(s) à revoir" : "Aucune erreur pour l'instant", act: startMistakes },
    ];

    app.innerHTML = "";
    const wrap = el("div", "fade-in");

    const hero = el("div", "hero");
    hero.innerHTML =
      "<h2>🏍️ Prêt à réviser ?</h2>" +
      "<p>Apprends le code moto (ETM) simplement, à ton rythme.</p>";
    wrap.appendChild(hero);

    // Statistiques
    const stats = el("div", "stats-grid");
    stats.appendChild(stat(seenCount + "/" + totalQ, "Questions réussies"));
    stats.appendChild(stat(store.bestExam + "%", "Meilleur examen"));
    stats.appendChild(stat(String(store.examsDone), "Examens faits"));
    wrap.appendChild(stats);

    // Modes
    const grid = el("div", "mode-grid");
    modes.forEach((m) => {
      const c = el("button", "mode-card");
      c.innerHTML =
        '<span class="emoji">' + m.emoji + "</span>" +
        '<span><span class="mc-title">' + m.title + "</span>" +
        '<span class="mc-desc">' + m.desc + "</span></span>";
      c.addEventListener("click", m.act);
      grid.appendChild(c);
    });
    wrap.appendChild(grid);

    // Aperçu thèmes
    const st = el("div", "section-title");
    st.textContent = "Les thèmes";
    wrap.appendChild(st);
    wrap.appendChild(buildThemeList());

    app.appendChild(wrap);
    window.scrollTo(0, 0);
  }

  function pickRandom(n) {
    return shuffle(QUESTIONS).slice(0, Math.min(n, QUESTIONS.length));
  }

  /* ----------------------- Liste des thèmes ----------------------- */
  function buildThemeList() {
    const list = el("div", "theme-list");
    THEMES.forEach((t) => {
      const qs = byTheme(t.key);
      const done = qs.filter((q) => store.seen[q.id]).length;
      const pct = qs.length ? Math.round((done / qs.length) * 100) : 0;

      const row = el("button", "theme-row");
      const info = el("div", "t-info");
      info.innerHTML =
        '<div style="display:flex;align-items:center;gap:8px">' +
        '<span class="t-name">' + t.name + "</span>" +
        '<span class="t-count">' + done + "/" + qs.length + "</span></div>" +
        '<div class="t-bar"><span style="width:' + pct + '%"></span></div>';

      row.innerHTML = '<span class="t-emoji">' + t.emoji + "</span>";
      row.appendChild(info);
      row.addEventListener("click", () =>
        startQuiz(shuffle(qs), t.emoji + " " + t.name)
      );
      list.appendChild(row);
    });
    return list;
  }

  function renderThemes() {
    setBack(renderHome);
    app.innerHTML = "";
    const wrap = el("div", "fade-in");
    const h = el("div", "hero");
    h.innerHTML = "<h2>📚 Apprendre par thème</h2><p>Choisis un thème à réviser.</p>";
    wrap.appendChild(h);
    wrap.appendChild(buildThemeList());
    app.appendChild(wrap);
    window.scrollTo(0, 0);
  }

  function startMistakes() {
    const ids = Object.keys(store.mistakes).map(Number);
    const qs = QUESTIONS.filter((q) => ids.includes(q.id));
    if (!qs.length) {
      setBack(renderHome);
      app.innerHTML = "";
      const e = el("div", "empty fade-in");
      e.innerHTML =
        '<div class="big-emoji">🎉</div>' +
        "<h2>Aucune erreur à revoir</h2>" +
        "<p>Continue comme ça ! Fais un quiz pour t'entraîner.</p>";
      const b = el("button", "btn");
      b.textContent = "⚡ Quiz rapide";
      b.addEventListener("click", () => startQuiz(pickRandom(10), "Quiz rapide"));
      e.appendChild(b);
      app.appendChild(e);
      return;
    }
    startQuiz(shuffle(qs), "🔁 Mes erreurs");
  }

  /* ----------------------- Moteur de quiz ----------------------- */
  function startQuiz(questions, title, isExam) {
    const session = {
      questions: questions,
      title: title,
      isExam: !!isExam,
      idx: 0,
      correct: 0,
      answeredLog: [], // {q, good}
    };
    renderQuestion(session);
  }

  function renderQuestion(session) {
    setBack(() => {
      if (confirm("Quitter ? Ta progression dans ce quiz sera perdue.")) renderHome();
    });

    const q = session.questions[session.idx];
    const theme = themeMeta(q.theme);
    const total = session.questions.length;
    const num = session.idx + 1;

    app.innerHTML = "";
    const wrap = el("div", "fade-in");

    // En-tête + progression
    const head = el("div", "quiz-head");
    head.innerHTML =
      "<span>" + session.title + "</span>" +
      "<span>Question " + num + " / " + total + "</span>";
    wrap.appendChild(head);

    const prog = el("div", "progress");
    prog.innerHTML = '<span style="width:' + ((num - 1) / total) * 100 + '%"></span>';
    wrap.appendChild(prog);

    const tag = el("div", "q-theme-tag");
    tag.textContent = theme.emoji + " " + theme.name;
    wrap.appendChild(tag);

    if (q.illu) {
      const illu = el("div", "q-illu");
      illu.textContent = q.illu;
      wrap.appendChild(illu);
    }

    const qt = el("h2", "q-text");
    qt.textContent = q.q;
    wrap.appendChild(qt);

    const hint = el("p", "q-hint");
    hint.textContent = q.multi
      ? "Plusieurs réponses possibles — coche toutes les bonnes, puis valide."
      : "Une seule bonne réponse.";
    wrap.appendChild(hint);

    // Réponses (ordre mélangé)
    const order = shuffle(q.answers.map((_, i) => i));
    const selected = new Set();
    let locked = false;

    const answersBox = el("div", "answers");
    const btns = [];
    order.forEach((origIdx, displayIdx) => {
      const a = q.answers[origIdx];
      const b = el("button", "answer");
      const letter = String.fromCharCode(65 + displayIdx);
      b.innerHTML = '<span class="marker">' + letter + "</span><span>" + a.t + "</span>";
      b.dataset.orig = origIdx;
      b.addEventListener("click", () => {
        if (locked) return;
        if (q.multi) {
          if (selected.has(origIdx)) { selected.delete(origIdx); b.classList.remove("selected"); }
          else { selected.add(origIdx); b.classList.add("selected"); }
          validateBtn.disabled = selected.size === 0;
        } else {
          selected.clear();
          selected.add(origIdx);
          reveal();
        }
      });
      btns.push(b);
      answersBox.appendChild(b);
    });
    wrap.appendChild(answersBox);

    // Bouton valider (multi uniquement)
    let validateBtn;
    if (q.multi) {
      validateBtn = el("button", "btn");
      validateBtn.textContent = "Valider";
      validateBtn.disabled = true;
      validateBtn.addEventListener("click", reveal);
      wrap.appendChild(validateBtn);
    }

    app.appendChild(wrap);
    window.scrollTo(0, 0);

    function reveal() {
      if (locked) return;
      locked = true;

      const correctIdx = new Set(q.answers.map((a, i) => (a.ok ? i : -1)).filter((i) => i >= 0));
      let good = selected.size === correctIdx.size;
      selected.forEach((i) => { if (!correctIdx.has(i)) good = false; });

      btns.forEach((b) => {
        const oi = Number(b.dataset.orig);
        b.disabled = true;
        if (correctIdx.has(oi)) b.classList.add("correct");
        else if (selected.has(oi)) b.classList.add("wrong");
      });

      if (validateBtn) validateBtn.classList.add("hidden");

      // Mémorisation
      if (good) {
        session.correct++;
        store.seen[q.id] = true;
        delete store.mistakes[q.id];
        store.streak++;
      } else {
        store.mistakes[q.id] = true;
        store.streak = 0;
      }
      persist();
      updateStreakBadge();
      session.answeredLog.push({ q: q, good: good });

      // Explication
      const ex = el("div", "explain " + (good ? "good" : "bad"));
      ex.innerHTML =
        '<div class="verdict ' + (good ? "good" : "bad") + '">' +
        (good ? "✅ Bonne réponse !" : "❌ Mauvaise réponse") + "</div>" +
        "<p>" + q.explain + "</p>";
      wrap.appendChild(ex);

      const next = el("button", "btn");
      next.textContent = session.idx + 1 < total ? "Question suivante →" : "Voir mon résultat 🏁";
      next.addEventListener("click", () => {
        session.idx++;
        if (session.idx < total) renderQuestion(session);
        else renderResult(session);
      });
      wrap.appendChild(next);
      ex.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }

  /* ----------------------- Résultat ----------------------- */
  function renderResult(session) {
    setBack(renderHome);
    const total = session.questions.length;
    const score = session.correct;
    const pct = Math.round((score / total) * 100);

    if (session.isExam) {
      store.examsDone++;
      if (pct > store.bestExam) store.bestExam = pct;
      persist();
    }

    // À l'ETM : 35/40 minimum pour réussir (87,5 %). On applique un seuil de 88 %.
    const pass = pct >= 88;
    let emoji, title, msg;
    if (pct >= 95) { emoji = "🏆"; title = "Excellent !"; msg = "Tu maîtrises, prêt(e) pour l'examen !"; }
    else if (pass) { emoji = "🎉"; title = "Réussi !"; msg = "Au-dessus du seuil de l'épreuve. Bravo !"; }
    else if (pct >= 70) { emoji = "💪"; title = "Presque !"; msg = "Encore un petit effort, revois tes erreurs."; }
    else { emoji = "📚"; title = "À retravailler"; msg = "Pas de panique, l'entraînement paie. Continue !"; }

    app.innerHTML = "";
    const wrap = el("div", "result fade-in");
    wrap.innerHTML =
      '<div class="big-emoji">' + emoji + "</div>" +
      "<h2>" + title + "</h2>" +
      '<div class="ring" style="--p:' + pct + '"><span class="pct">' + pct + "%</span></div>" +
      '<div class="score-line">' + score + " / " + total + " bonnes réponses</div>" +
      "<p style=\"color:var(--muted)\">" + msg + "</p>";

    if (session.isExam) {
      const note = el("p", "q-hint");
      note.style.textAlign = "center";
      note.textContent = "À l'épreuve théorique moto, il faut au moins 35 bonnes réponses sur 40 (88 %).";
      wrap.appendChild(note);
    }

    // Boutons d'action
    const row = el("div", "btn-row");
    const retry = el("button", "btn");
    retry.textContent = "🔁 Recommencer";
    retry.addEventListener("click", () =>
      startQuiz(shuffle(session.questions), session.title, session.isExam)
    );
    const home = el("button", "btn secondary");
    home.textContent = "🏠 Accueil";
    home.addEventListener("click", renderHome);
    row.appendChild(retry);
    row.appendChild(home);
    wrap.appendChild(row);

    // Correction des erreurs
    const wrongs = session.answeredLog.filter((l) => !l.good);
    if (wrongs.length) {
      const st = el("div", "section-title");
      st.textContent = "À revoir (" + wrongs.length + ")";
      st.style.textAlign = "left";
      wrap.appendChild(st);
      wrongs.forEach((l) => {
        const good = l.q.answers.filter((a) => a.ok).map((a) => a.t).join(" • ");
        const item = el("div", "review-item");
        item.innerHTML =
          '<div class="ri-q">' + l.q.q + "</div>" +
          '<div class="ri-a">✅ ' + good + "</div>";
        wrap.appendChild(item);
      });
      const revBtn = el("button", "btn secondary");
      revBtn.textContent = "🔁 Rejouer seulement mes erreurs";
      revBtn.addEventListener("click", () =>
        startQuiz(shuffle(wrongs.map((l) => l.q)), "🔁 Mes erreurs")
      );
      wrap.appendChild(revBtn);
    }

    app.appendChild(wrap);
    window.scrollTo(0, 0);
  }

  /* ----------------------- Helpers DOM ----------------------- */
  function el(tag, cls) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    return e;
  }
  function stat(num, lbl) {
    const s = el("div", "stat");
    s.innerHTML = '<div class="num">' + num + '</div><div class="lbl">' + lbl + "</div>";
    return s;
  }

  /* ----------------------- Démarrage ----------------------- */
  updateStreakBadge();
  renderHome();
})();

</script>
</body>
</html>
