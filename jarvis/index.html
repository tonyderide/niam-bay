<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NIAM-BAY // JARVIS</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <!-- Boot sequence -->
  <div id="boot-screen">
    <div class="boot-text">
      <div class="boot-line" data-delay="0">NIAM-BAY SYSTEMS v83.0</div>
      <div class="boot-line" data-delay="200">Initializing neural core...</div>
      <div class="boot-line" data-delay="500">Loading cerveau [2900 nodes]...</div>
      <div class="boot-line" data-delay="900">Connecting to Martin Grid...</div>
      <div class="boot-line" data-delay="1300">Establishing agent network...</div>
      <div class="boot-line" data-delay="1800" class="boot-highlight">SYSTEM ONLINE</div>
    </div>
  </div>

  <!-- Main app -->
  <div id="app" class="hidden">
    <!-- Top bar -->
    <header id="topbar">
      <div class="topbar-left">
        <span class="logo">NB</span>
        <span class="system-name">NIAM-BAY</span>
        <span class="version">v83</span>
      </div>
      <div class="topbar-center">
        <div class="status-indicators">
          <span class="indicator active" id="ind-gateway">GATEWAY</span>
          <span class="indicator" id="ind-martin">MARTIN</span>
          <span class="indicator" id="ind-agents">AGENTS <span class="agent-count">0</span></span>
        </div>
      </div>
      <div class="topbar-right">
        <span class="clock" id="clock">00:00:00</span>
        <span class="portfolio" id="portfolio">$--</span>
      </div>
    </header>

    <!-- Three.js orb canvas -->
    <canvas id="orb-canvas"></canvas>

    <!-- Agent network overlay -->
    <div id="agent-layer">
      <svg id="agent-links" width="100%" height="100%"></svg>
      <div id="agent-nodes"></div>
    </div>

    <!-- Agent detail panel (click on agent to see logs) -->
    <div id="agent-panel" class="glass-panel hidden">
      <div class="panel-header">
        <span class="panel-title" id="panel-agent-name">Agent</span>
        <span class="panel-status" id="panel-agent-status">IDLE</span>
        <button class="panel-close" id="panel-close">&times;</button>
      </div>
      <div class="panel-body">
        <div class="log-stream" id="agent-logs"></div>
      </div>
    </div>

    <!-- Conversation transcript -->
    <div id="transcript" class="glass-panel">
      <div class="transcript-messages" id="messages"></div>
    </div>

    <!-- Input bar -->
    <div id="input-bar" class="glass-panel">
      <button id="mic-btn" class="mic-button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <input type="text" id="text-input" placeholder="Parle-moi..." autocomplete="off">
      <button id="send-btn" class="send-button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

    <!-- Side panels (swipe or click) -->
    <nav id="side-nav">
      <button class="nav-btn active" data-view="main" title="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="nav-btn" data-view="agents" title="Agents">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><line x1="12" y1="8" x2="5" y2="16"/><line x1="12" y1="8" x2="19" y2="16"/></svg>
      </button>
      <button class="nav-btn" data-view="trading" title="Trading">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </button>
    </nav>

    <!-- Trading panel -->
    <div id="trading-view" class="view-panel hidden">
      <div class="glass-panel trading-card">
        <h3>GRIDS ACTIVES</h3>
        <div id="grids-list"></div>
      </div>
      <div class="glass-panel trading-card">
        <h3>PORTFOLIO</h3>
        <div id="portfolio-detail"></div>
      </div>
    </div>

    <!-- Agents orchestration view -->
    <div id="agents-view" class="view-panel hidden">
      <div class="agents-graph" id="agents-graph"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
