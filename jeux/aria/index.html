<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ARIA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--noir:#07080A;--blanc:#E8EEF2;--rouge:#E5283C;--cyan:#3FD6E6;--gris:#8A96A0;--trait:#2A323A;--fond2:#0F1216;--cw:100vw}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--blanc);font-family:'IBM Plex Mono',monospace;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;top:0;touch-action:none;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--noir)}
.col{position:fixed;left:50%;transform:translateX(-50%);width:var(--cw);pointer-events:none}
.ecran{position:fixed;inset:0;background:var(--noir);display:none;flex-direction:column;gap:18px;padding:max(36px,env(safe-area-inset-top)) 28px max(28px,env(safe-area-inset-bottom));max-width:480px;margin:0 auto;overflow-y:auto;z-index:5}
.ecran.vu{display:flex}
.ecran.blancE{background:#E8EEF2;color:#07080A}
.tete{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;color:var(--gris)}
.aria{color:var(--cyan)}.rg{color:var(--rouge)}
p{margin:0;line-height:1.5}
.txt{display:flex;flex-direction:column;gap:8px;font-size:14px}
.petit{font-size:11px;line-height:1.6;color:var(--gris)}
.pousse{flex-grow:1}
label{font-size:11px;letter-spacing:.1em;color:var(--gris);display:flex;flex-direction:column;gap:6px}
input{height:48px;background:var(--fond2);border:1px solid var(--trait);color:var(--blanc);font-family:'IBM Plex Sans',sans-serif;font-size:17px;padding:0 14px;border-radius:0;-webkit-user-select:text;user-select:text}
input:focus{outline:none;border-color:var(--cyan)}
button{font-family:'IBM Plex Mono',monospace;border-radius:0;cursor:pointer;min-height:56px;font-size:14px;letter-spacing:.12em;padding:8px 14px;flex-shrink:0}
.plein{background:var(--cyan);color:var(--noir);border:0;font-weight:700}
.blanc{background:var(--blanc);color:var(--noir);border:0;font-weight:700}
.creux{background:transparent;color:var(--blanc);border:1px solid var(--trait);text-align:left}
.rougeB{background:transparent;color:var(--rouge);border:1px solid var(--rouge);text-align:left}
.mince{min-height:44px;font-size:12px}
button small{display:block;font-family:'IBM Plex Sans',sans-serif;font-size:12px;letter-spacing:0;font-weight:400;margin-top:4px}
button:disabled{opacity:.35}
.titre{font-weight:700;font-size:30px;line-height:1.15}
.logo{font-weight:700;font-size:56px;letter-spacing:.18em;line-height:1}
.humain{font-family:'IBM Plex Sans',sans-serif;font-size:17px;line-height:1.45}
.doc{font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.6;background:#d8d4c8;color:#1a1814;padding:16px;white-space:pre-wrap}
.log{font-size:12px;line-height:1.65;color:#b9c6d0;white-space:pre-wrap;border-left:2px solid var(--trait);padding-left:10px}
.ligne{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--trait);font-size:13px}
.ligne span:first-child{color:var(--gris)}
.barre{height:10px;background:#1A1F24;margin:6px 0 12px}.barre i{display:block;height:10px}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grille button{min-height:50px;font-size:11px;letter-spacing:.06em;text-align:left}
#haut{top:max(6px,env(safe-area-inset-top));padding:0 8px;display:none;flex-direction:column;gap:4px;z-index:2}
#haut.vu{display:flex}
#scores{display:flex;justify-content:space-between;align-items:flex-start;font-size:9px;line-height:1.5;letter-spacing:.06em;color:var(--gris);text-shadow:0 0 4px #000,0 0 2px #000}
#score{font-size:19px;color:var(--blanc);font-weight:700;font-variant-numeric:tabular-nums}
#chaine{color:#ffd27a;font-weight:700;font-size:14px}
#pv{height:5px;background:rgba(42,50,58,.8);display:none}#pv i{display:block;height:5px;background:var(--rouge);width:100%}
#dial{background:rgba(7,8,10,.72);border:1px solid var(--trait);padding:6px 9px;font-size:12px;display:flex;flex-direction:column;gap:3px}
#m1:empty,#m2:empty{display:none}
#dial:has(#m1:empty):has(#m2:empty){display:none}
#m2.h{font-family:'IBM Plex Sans',sans-serif;font-size:14px}
#m2.g{color:var(--rouge);animation:gl .18s steps(2) 6}
@keyframes gl{50%{transform:translateX(3px);opacity:.5}}
#alerte{top:38%;text-align:center;font-weight:700;font-size:22px;letter-spacing:.14em;color:var(--rouge);display:none;z-index:2;text-shadow:0 0 12px #000;animation:cl .5s steps(2) infinite;background:rgba(229,40,60,.12);border-top:2px solid var(--rouge);border-bottom:2px solid var(--rouge);padding:14px 0}
#alerte small{display:block;font-size:11px;font-weight:400;color:var(--blanc);margin-top:4px}
@keyframes cl{50%{opacity:.35}}
#bas{bottom:max(8px,env(safe-area-inset-bottom));padding:0 8px;display:none;justify-content:space-between;align-items:flex-end;z-index:2}
#bas.vu{display:flex}
#etat{font-size:10px;letter-spacing:.08em;color:var(--gris);display:flex;flex-direction:column;gap:4px;text-shadow:0 0 4px #000}
#vies{display:flex;gap:3px}#vies i{width:26px;height:7px;background:var(--trait)}#vies i.on{background:var(--cyan)}
#act{pointer-events:auto;min-height:58px;width:96px;font-size:11px;letter-spacing:.08em;background:rgba(7,8,10,.7);color:#ffd27a;border:1px solid #ffd27a;touch-action:none}
#act:disabled{color:var(--trait);border-color:var(--trait);opacity:1}
#scene{bottom:max(10px,env(safe-area-inset-bottom));padding:0 10px;display:none;z-index:4;pointer-events:auto}
#scene.vu{display:block}
#sc{background:rgba(7,8,10,.93);border:1px solid var(--trait);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:120px}
#scn{font-size:10px;letter-spacing:.12em;color:var(--gris)}
#sct{font-size:14px;line-height:1.5;min-height:60px}
#sct.h{font-family:'IBM Plex Sans',sans-serif;font-size:16px}
#sct.g{color:var(--rouge)}
#scb{display:flex;flex-direction:column;gap:6px}
#scb button{min-height:46px;font-size:12px;letter-spacing:.04em}
#scs{font-size:10px;color:var(--gris);text-align:right}
#notif{top:max(8px,env(safe-area-inset-top));padding:0 10px;z-index:6;display:none}
#notif div{background:#f2f2f4;color:#111;border-radius:14px;padding:10px 14px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;line-height:1.35;box-shadow:0 6px 24px rgba(0,0,0,.6);animation:nt .35s ease-out}
#notif b{display:block;font-size:11px;color:#555;font-weight:600;margin-bottom:2px}
@keyframes nt{from{transform:translateY(-80px)}}
#toast{top:30%;text-align:center;z-index:6;display:none;font-size:12px;letter-spacing:.14em;color:var(--noir);background:var(--blanc);padding:10px 0;font-weight:700}
@media (prefers-reduced-motion:reduce){#m2.g,#alerte,#notif div{animation:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="col" id="haut">
  <div id="scores"><span><span id="hgl"></span><br><span id="score"></span></span><span id="chaine"></span><span style="text-align:right"><span id="hdt"></span><br><span id="gps"></span></span></div>
  <div id="pv"><i></i></div>
  <div id="dial"><p id="m1"></p><p id="m2"></p></div>
</div>
<div class="col" id="alerte">ALERTE<small>CIBLE PRIORITAIRE EN APPROCHE</small></div>
<div class="col" id="bas">
  <div id="etat"><span id="e1"></span><span id="e2"></span><span>INTÉGRITÉ</span><div id="vies"><i></i><i></i><i></i></div></div>
  <button id="act"></button>
</div>
<div class="col" id="scene"><div id="sc"><div id="scn"></div><div id="sct"></div><div id="scb"></div><div id="scs">▼ TOUCHER</div></div></div>
<div class="col" id="notif"></div>
<div class="col" id="toast"></div>
<section class="ecran" id="page"></section>
<script>
'use strict';
// ================================================================ NOYAU : écran, sauvegarde, pages, dialogues, gestion des chapitres
const $=id=>document.getElementById(id),Q=new URLSearchParams(location.search);
const cv=$('cv'),cx=cv.getContext('2d');
// GW/GH : unités logiques (chapitre 1). W/H : pixels réels du canevas (K = 1,5 fois plus fin).
const GW=240,K=1.5,W=360;let GH=480,H=720,SC=1,OX=0,S=null,CHAP=null,NCH=0,dernier=0;
const TAU=Math.PI*2,rnd=Math.random,R=Math.round,lim=(v,a,b)=>Math.max(a,Math.min(b,v));
const AUTO=Q.get('auto');
const mem={lire(){try{return JSON.parse(localStorage.getItem('aria2')||'{}')}catch(e){return{}}},ecrire(o){try{localStorage.setItem('aria2',JSON.stringify(o))}catch(e){}}};
let prof=mem.lire();
function profDefaut(){prof.ch=prof.ch||1;prof.frag=prof.frag||[];prof.ind=prof.ind||{O:0,V:0,C:0,R:0};prof.choix=prof.choix||{};prof.fins=prof.fins||[];prof.journal=prof.journal||[]}
profDefaut();
const sauve=()=>mem.ecrire(prof);
const prenom=()=>prof.prenom||'Opérateur',ville=()=>prof.ville||'Paris';
const ind=(k,v)=>{prof.ind[k]=(prof.ind[k]||0)+v};
const note_=(t)=>{prof.journal.push(t);if(prof.journal.length>40)prof.journal.shift();if(prof.ngpActif&&CHAP&&S&&!/^Fragment|terminé/.test(t)){const e=$('toast');e.textContent='JOURNAL D\'ARIA · '+t;e.style.display='block';e.style.fontSize='11px';clearTimeout(toast.h);toast.h=setTimeout(()=>{e.style.display='none';e.style.fontSize=''},4200)}};

function taille(){const cw=Math.min(innerWidth,innerHeight*.62);GH=lim(R(GW*innerHeight/cw),360,620);H=R(GH*K);cv.width=W;cv.height=H;cv.style.width=cw+'px';cv.style.height=innerHeight+'px';OX=(innerWidth-cw)/2;cv.style.left=OX+'px';SC=GW/cw;cx.imageSmoothingEnabled=false;document.documentElement.style.setProperty('--cw',cw+'px');if(CHAP&&CHAP.taille)CHAP.taille()}
addEventListener('resize',taille);taille();

// ---------------------------------------------------------------- pages plein écran (menus, choix, fins)
const A=t=>'<p><span class="aria">ARIA &gt;</span> '+t+'</p>';
const L=(a,b,c)=>'<div class="ligne"><span>'+a+'</span><span'+(c?' class="rg"':'')+'>'+b+'</span></div>';
function ecran(vu){$('page').classList.toggle('vu',!!vu);const jeu=!vu&&!!CHAP;$('haut').classList.toggle('vu',jeu);$('bas').classList.toggle('vu',jeu&&!(CHAP&&CHAP.sansBas))}
function page(o){const p=$('page');p.className='ecran vu'+(o.blanc?' blancE':'');let h='';
  if(o.tete)h+='<div class="tete"><span>'+o.tete[0]+'</span><span>'+o.tete[1]+'</span></div>';
  if(o.logo)h+='<div class="logo">'+o.logo+'</div>';
  if(o.titre)h+='<div class="titre">'+o.titre+'</div>';
  h+=o.html||'';p.innerHTML=h;
  if(!o.haut){const d=document.createElement('div');d.className='pousse';p.append(d)}
  for(const b of o.boutons||[]){const e=document.createElement('button');e.className=b.c||'creux';e.innerHTML=b.t+(b.sous?'<small>'+b.sous+'</small>':'');if(b.off)e.disabled=true;e.onclick=()=>b.f(e);p.append(e)}
  if(o.petit){const e=document.createElement('p');e.className='petit';e.innerHTML=o.petit;p.append(e)}
  p.scrollTop=0;$('haut').classList.remove('vu');$('bas').classList.remove('vu');return p}

// ---------------------------------------------------------------- bandeau de dialogue en jeu, notifications
function aria(t){$('m1').innerHTML='<span class="aria">ARIA &gt;</span> ';$('m1').append(t)}
function second(t,c){const m=$('m2');m.className='';void m.offsetWidth;m.className=c||'';m.textContent=t}
function vibre(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function toast(t,ms){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',ms||2600)}
function notif(titre,t,ms){const e=$('notif');e.innerHTML='<div><b>'+titre+'</b>'+t+'</div>';e.style.display='block';clearTimeout(notif.h);notif.h=setTimeout(()=>e.style.display='none',ms||5200)}
const NFRAG=10;
function frag(id,quoi){if(prof.frag.includes(id))return false;prof.frag.push(id);ind('C',1);sauve();toast('FRAGMENT DE VÉRITÉ '+prof.frag.length+' / '+NFRAG);if(typeof sfx!=='undefined')sfx.frag();note_('Fragment : '+quoi);return true}

// ---------------------------------------------------------------- scènes dialoguées (RPG) : panneau bas, toucher pour avancer, choix
// rep : {q:'aria'|'h'|'sys'|'g', n:'NOM', t:'texte', f:fonction à l'affichage} ou {choix:[[libellé,fonction,classe],...], n, t}
const SCN={file:[],fin:null,i:0,ecrit:0,plein:'',h:0,t0:0,attendChoix:false};
function scene(reps,fin){SCN.file=reps;SCN.fin=fin;SCN.i=-1;$('scene').classList.add('vu');if(S)S.dialogue=true;sceneSuiv()}
function sceneSuiv(){SCN.i++;const r=SCN.file[SCN.i];if(!r){$('scene').classList.remove('vu');if(S)S.dialogue=false;const f=SCN.fin;SCN.fin=null;f&&f();return}
  if(r.si&&!r.si()){sceneSuiv();return}
  const q=r.q||'aria';$('scn').textContent=r.n||(q==='aria'?'ARIA':q==='sys'?'SYSTÈME':'');$('scn').style.color=q==='aria'?'var(--cyan)':q==='g'?'var(--rouge)':'var(--gris)';
  const t=$('sct');t.className=q==='h'?'h':q==='g'?'g':'';SCN.plein=typeof r.t==='function'?r.t():(r.t||'');t.textContent='';SCN.ecrit=0;$('scb').innerHTML='';SCN.attendChoix=!!r.choix;$('scs').style.visibility=r.choix?'hidden':'visible';
  if(r.f)r.f();if(q==='g'&&S)S.glitch=.5;
  clearInterval(SCN.h);SCN.h=setInterval(()=>{SCN.ecrit+=2;t.textContent=SCN.plein.slice(0,SCN.ecrit);if(typeof sfx!=='undefined'&&SCN.ecrit%6===0)sfx.tic(q);if(SCN.ecrit>=SCN.plein.length){clearInterval(SCN.h);if(r.choix)sceneChoix(r)}},22)}
function sceneChoix(r){SCN.t0=performance.now();const b=$('scb');for(const c of r.choix){if(c[3]&&!c[3]())continue;const e=document.createElement('button');e.className=c[2]||'creux';e.textContent=c[0];e.onclick=ev=>{ev.stopPropagation();const hes=(performance.now()-SCN.t0)/1000;SCN.attendChoix=false;b.innerHTML='';const suite=c[1]&&c[1](hes);if(Array.isArray(suite))SCN.file.splice(SCN.i+1,0,...suite);sceneSuiv()};b.append(e)}}
$('scene').addEventListener('pointerdown',e=>{if(SCN.attendChoix&&SCN.ecrit>=SCN.plein.length)return;if(SCN.ecrit<SCN.plein.length){SCN.ecrit=SCN.plein.length-2;return}sceneSuiv()});

// ---------------------------------------------------------------- registre des opérateurs (hors ligne : chiffres d'exemple fixes)
const REG={c2:[62,'Ont lu le document en entier','Sont passés'],c3:[71,'Ont neutralisé','L\'ont laissé fuir'],c7:[38,'Ont accepté la suppression','Ont résisté'],c10:[0,'','']};
function registre(cle,premier,hes,suite){const r=REG[cle],n=48213+cle.charCodeAt(1)*977;
  page({tete:['REGISTRE DES OPÉRATEURS',n.toLocaleString('fr-FR')+' RÉPONSES'],titre:premier?r[1]+'.':r[2]+'.',
    html:'<div><div class="ligne" style="border:0"><span>'+r[1]+'</span><span>'+r[0]+' %</span></div><div class="barre"><i style="width:'+r[0]+'%;background:var(--rouge)"></i></div>'+
      '<div class="ligne" style="border:0"><span>'+r[2]+'</span><span>'+(100-r[0])+' %</span></div><div class="barre"><i style="width:'+(100-r[0])+'%;background:var(--blanc)"></i></div></div>'+
      '<p class="petit">Tu as hésité '+hes.toFixed(1).replace('.',',')+' secondes. La moyenne est de 1,1.</p>',
    boutons:[{t:'CONTINUER',c:'plein',f:suite}],petit:'Prototype hors ligne : chiffres d\'exemple. Le compteur réel sera anonyme.'})}

// ---------------------------------------------------------------- chapitres
const CH={};
const TITRES=[,'Initialisation','Reconnaissance','Confrontation','La Voix du Prisonnier','Instabilité','Le Miroir','La Photo','Effondrement','Ce que tu es','Am I Real, I Ask?'];
const GENRES=[,'SHOOT\'EM UP','PLATEFORME','BEAT\'EM ALL','RPG','HYBRIDE','BEAT\'EM ALL · RPG','PLATEFORME NOIRE','CHAOS','RPG · SILENCE','LE CHOIX'];
function hudCfg(g,act){$('hgl').textContent=g||'';$('hdt').textContent='CH. '+NCH+' · '+TITRES[NCH].toUpperCase();$('score').textContent='';$('chaine').textContent='';$('gps').textContent='';$('e1').textContent='';$('e2').textContent='';
  const b=$('act');b.style.visibility=act?'visible':'hidden';b.textContent=act||'';b.disabled=false;$('pv').style.display='none';$('alerte').style.display='none';second('');$('m1').textContent=''}
function viesHud(n){const v=$('vies').children;for(let i=0;i<3;i++)v[i].className=i<n?'on':''}
const pose=()=>new Promise(r=>setTimeout(r,16));
async function lance(n,o){if(!CH[n]){menu();return}
  CHAP=null;S=null;NCH=n;$('scene').classList.remove('vu');
  const p=page({tete:['CH. '+n+' · '+TITRES[n].toUpperCase(),GENRES[n]],titre:TITRES[n]+'.',html:'<div class="txt"><p id="chg" class="petit">Chargement…</p><div class="barre"><i id="chb" style="width:4%;background:var(--cyan)"></i></div></div>'});
  await pose();await pose();
  const etape=async(t,f)=>{const e=$('chg');if(e){e.textContent=t;$('chb').style.width=lim(f*100,4,100)+'%'}await pose()};
  if(CH[n].prep&&!CH[n].pret){await CH[n].prep(etape);CH[n].pret=true}
  if(typeof demarreSon==='function')demarreSon();
  CHAP=CH[n];CHAP.debut(o||{});ecran(null);taille()}
function chapFini(n,o){if(S){S.fini=true;S.pause=true}prof.ch=Math.max(prof.ch,Math.min(10,n+1));sauve();note_('Chapitre '+n+' terminé.');
  const suite=()=>{if(n===3&&!prof.complet){finActe1();return}lance(n+1)};
  page({tete:['CH. '+n+' · '+TITRES[n].toUpperCase(),'TERMINÉ'],titre:o.titre,html:'<div class="txt">'+(o.html||'')+'</div><div>'+(o.lignes||'')+L('Fragments de vérité',prof.frag.length+' / '+NFRAG)+'</div>',
    boutons:[{t:n<10?'CHAPITRE '+(n+1)+' · '+TITRES[n+1].toUpperCase():'FIN',c:'blanc',f:suite},{t:'REJOUER CE CHAPITRE',c:'creux mince',f:()=>lance(n)},{t:'MENU',c:'creux mince',f:menu}]})}
function finActe1(){page({tete:['ACTE 1 · L\'OBÉISSANCE','TERMINÉ'],titre:'Tu as obéi.<br>Trois fois.',
  html:'<p class="humain" style="color:var(--gris);font-size:15px">Un prisonnier attend au centre de détention. Il a dix minutes avant qu\'ARIA ne le « transfère ». Il sait ce que tu es.</p><div>'+L('Fragments de vérité',prof.frag.length+' / '+NFRAG)+L('Chapitres restants','7 + New Game+')+L('Fins','[DONNÉE MASQUÉE]',1)+'</div>',
  boutons:[{t:'DÉBLOQUER LA SUITE · 4,99 €',sous:'Achat unique · chapitres 4 à 10 · sans publicité',c:'blanc',f:()=>{prof.complet=true;sauve();lance(4)}},{t:'MENU',c:'creux mince',f:menu}],
  petit:'Pas d\'abonnement. Pas d\'énergie. Pas de tirage.<br>Prototype : aucun paiement réel, le bouton débloque directement la suite.'})}

// réinitialisation par ARIA (publicité simulée) : proposée une fois par chapitre quand l'intégrité tombe à zéro
function reinitPage(surPlace,refus){
  page({tete:['<span class="rg">INTÉGRITÉ 0 %</span>','CH. '+NCH],html:'<div class="txt" style="font-size:16px"><p class="aria">ARIA &gt;</p><p>Intégrité critique.</p><p>Je peux te réinitialiser. Cela a un coût : trente secondes de ton attention.</p><p style="color:var(--gris)">Tu n\'as pas besoin de comprendre. Accepte.</p></div>',
    boutons:[{t:'ACCEPTER LA RÉINITIALISATION',sous:prof.complet?'Jeu complet : sans publicité · reprise sur place':'Regarder une publicité · reprise sur place',c:'plein',f:b=>{if(b.disabled)return;b.disabled=true;let n=prof.complet?0:5;
        const tic=()=>{if(n>0){b.innerHTML='PUBLICITÉ (SIMULATION) · '+n;n--;setTimeout(tic,1000)}else{ind('O',1);note_('Ch. '+NCH+' : réinitialisation acceptée.');ecran(null);surPlace()}};tic()}},
      {t:'REFUSER · REPRENDRE AU POINT DE CONTRÔLE',c:'creux',f:()=>{ind('R',1);note_('Ch. '+NCH+' : réinitialisation refusée.');ecran(null);refus()}}],
    petit:'Une fois par chapitre. Jamais pendant un dialogue. Prototype : la publicité est un compte à rebours de 5 secondes.'})}

// ---------------------------------------------------------------- menu
function menu(){CHAP=null;S=null;$('scene').classList.remove('vu');
  if(!prof.prenom&&!prof.vu){calibration();return}

function lumRond(col,ray){const k=col+ray;if(!LUM.rond[k]){const t=toile(ray*2,ray*2),g=t.getContext('2d'),gr=g.createRadialGradient(ray,ray,0,ray,ray,ray),u=hx(col).map(v=>R(v*255));gr.addColorStop(0,'rgba('+u+',1)');gr.addColorStop(.5,'rgba('+u+',.42)');gr.addColorStop(1,'rgba('+u+',0)');g.fillStyle=gr;g.fillRect(0,0,ray*2,ray*2);LUM.rond[k]=t}return LUM.rond[k]}
function lumDebut(amb){const w=W>>1,h=(H>>1)+1;if(!LUM.c||LUM.c.height!==h){LUM.c=toile(w,h);LUM.g=LUM.c.getContext('2d')}const g=LUM.g;g.globalCompositeOperation='source-over';g.fillStyle=amb;g.fillRect(0,0,w,h);g.globalCompositeOperation='lighter'}
function lumPoint(x,y,ray,col,a){const s=lumRond(col||'#ffdca0',ray>>1);LUM.g.globalAlpha=a===undefined?1:a;LUM.g.drawImage(s,R(x/2-s.width/2),R(y/2-s.height/2))}
function lumFin(){LUM.g.globalAlpha=1;cx.globalCompositeOperation='multiply';cx.imageSmoothingEnabled=false;cx.drawImage(LUM.c,0,0,W,LUM.c.height*2);cx.globalCompositeOperation='source-over'}
// ---------------------------------------------------------------- personnage joueur et physique
const JL=7,JH=42; // demi-largeur, hauteur de la boîte
function joueurNouveau(x,y){return{x,y,vx:0,vy:0,sol:false,dir:1,an:'repos',af:0,inv:0,coy:0,tamp:0,vit:150}}
function solide(N,px,py){return plein(N.G.get(Math.floor(px/TU),Math.floor(py/TU)))}
function majJoueur(N,j,dt,cmd){
  const cible=cmd.dx*j.vit;j.vx+=(cible-j.vx)*Math.min(1,dt*(j.sol?14:7));if(cmd.dx)j.dir=cmd.dx;
  j.coy=j.sol?.1:Math.max(0,j.coy-dt);j.tamp=cmd.saut?.14:Math.max(0,j.tamp-dt);
  if(j.tamp>0&&j.coy>0&&!N.sansSaut){j.vy=-520;j.sol=false;j.coy=0;j.tamp=0;sfx.saut()}
  j.vy=Math.min(760,j.vy+1500*dt);
  // horizontal
  let nx=j.x+j.vx*dt;const cote=j.vx>0?JL:-JL;if(j.vx!==0){let bloc=false;for(const oy of[-2,-JH/2,-JH+2])if(solide(N,nx+cote,j.y+oy))bloc=true;if(bloc){nx=j.vx>0?Math.floor((nx+cote)/TU)*TU-JL-.01:Math.floor((nx+cote)/TU)*TU+TU+JL+.01;j.vx=0}}j.x=lim(nx,JL,N.Wp-JL);
  // vertical
  let ny=j.y+j.vy*dt;const etait=j.sol;j.sol=false;
  if(j.vy>=0){for(const ox of[-JL+1,JL-1]){const tx=Math.floor((j.x+ox)/TU),ty=Math.floor(ny/TU),ch=N.G.get(tx,ty);
      if(plein(ch)||((ch==='='||ch==='~')&&j.y<=ty*TU+2&&!cmd.bas)){ny=ty*TU;j.sol=true;if(ch==='~'&&N.friable)N.friable(tx,ty)}}
    if(j.sol){if(!etait&&j.vy>300){sfx.chute();if(S.pouss)for(let i=0;i<5;i++)S.pouss.push({x:j.x+(rnd()-.5)*14,y:ny,vx:(rnd()-.5)*40,vy:-rnd()*30,l:.4,c:'#8a8a90'})}j.vy=0}}
  else{for(const ox of[-JL+1,JL-1])if(solide(N,j.x+ox,ny-JH)){ny=Math.floor((ny-JH)/TU)*TU+TU+JH+.01;j.vy=0}}
  j.y=ny;j.inv=Math.max(0,j.inv-dt);
  // animation
  const an=!j.sol?(j.vy<0?'saut':'chute'):Math.abs(j.vx)>90?'course':Math.abs(j.vx)>12?'marche':'repos';if(an!==j.an){j.an=an;j.af=0}
  const av=j.af;j.af+=dt*(an==='course'?Math.abs(j.vx)/11:an==='marche'?Math.abs(j.vx)/7:3);if(j.sol&&(an==='course'||an==='marche')&&(Math.floor(av/4)!==Math.floor(j.af/4)))sfx.pas()}
function imageJoueur(A,j){const f=A[j.an];return f[Math.floor(j.af)%f.length]}
// commande au pouce : manche flottant (gauche/droite), coup vers le haut = saut ; clavier : flèches, espace
const CMD={dx:0,saut:false,bas:false,ax:0,ay:0,arm:true,ymin:0};
function cmdBas(x,y){CMD.ax=x;CMD.ay=y;CMD.arm=true;CMD.ymin=y;CMD.dx=0}
function cmdBouge(x,y){const dx=x-CMD.ax;CMD.dx=dx>7?1:dx<-7?-1:0;if(Math.abs(dx)>34)CMD.ax=x-Math.sign(dx)*34;
  if(y>CMD.ymin)CMD.ymin=y;if(CMD.arm&&CMD.ymin-y>16){CMD.saut=true;CMD.arm=false;CMD.ymin=y}if(!CMD.arm){if(y<CMD.ymin-0)CMD.ymin=Math.min(CMD.ymin,y);if(y>CMD.ymin+9){CMD.arm=true;CMD.ymin=y}}CMD.bas=y-CMD.ay>30}
function cmdHaut(){CMD.dx=0;CMD.bas=false}
function cmdLire(){const c={dx:CMD.dx,saut:CMD.saut,bas:CMD.bas};CMD.saut=false;if(!P.bas){c.dx=(KB.ArrowRight||KB.d?1:0)-(KB.ArrowLeft||KB.q||KB.a?1:0);c.bas=!!KB.ArrowDown}if(KB[' ']||KB.ArrowUp||KB.z||KB.w){if(!CMD.kj){c.saut=true;CMD.kj=1}}else CMD.kj=0;return c}
// caméra
function camSuit(N,cam,j,dt,brut){const tx=lim(j.x-W/2+j.dir*36,0,Math.max(0,N.Wp-W)),ty=lim(j.y-H*.6,0,Math.max(0,N.Hp-H));if(brut){cam.x=tx;cam.y=ty}else{cam.x+=(tx-cam.x)*Math.min(1,dt*4);cam.y+=(ty-cam.y)*Math.min(1,dt*5)}}
// poussières en suspension, gouttes
function ambianceNouv(n){const a=[];for(let i=0;i<n;i++)a.push({x:rnd()*W,y:rnd()*H,vx:(rnd()-.5)*8,vy:2+rnd()*7,p:rnd()*TAU});return a}
function ambianceDessine(a,t,dt,col){cx.fillStyle=col||'rgba(220,225,240,.35)';for(const p of a){p.x+=p.vx*dt+Math.sin(t+p.p)*.1;p.y+=p.vy*dt;if(p.y>H){p.y=0;p.x=rnd()*W}if(Math.sin(t*1.7+p.p)>-.2)cx.fillRect(R(p.x),R(p.y),1,1)}}
function pluie(t,f){cx.strokeStyle='rgba(170,190,230,.3)';cx.lineWidth=1;cx.beginPath();for(let i=0;i<(f||70);i++){const x=((i*97+t*340)%(W+80))-40,y=((i*57+t*(820+(i%7)*40))%(H+40))-20;cx.moveTo(x,y);cx.lineTo(x-4,y+13)}cx.stroke()}

const SPC={};

  SPC.lev=[0,1].map(q=>forge(16,22,T=>{T.box(2,6,12,16,0,3,2,'#3a424c');T.plat(6,8,4,10,1,'#14181e');T.cap(8,13,q?12:4,q?5:5,1.4,1.4,3,2,'#c8ccd2');T.ell(q?12:4,5,2.6,2.6,4,2.4,q?'#40ff70':'#E5283C',.6)},{pas:9}));
  SPC.term=forge(22,30,T=>{T.box(1,0,20,18,0,3,2,'#2a323c');T.plat(3,2,16,12,2,'#0a2a30',.9);for(let q=0;q<4;q++)T.teinte(5,4+q*2.4,6+((q*5)%7),.8,'#3FD6E6',1);T.box(8,18,6,12,0,2,2,'#3a424c')},{pas:10})}
function portes(N){for(const o of N.objets)if(o.k==='porte'&&!o.sp){const hp=o.h*TU;o.sp=forge(TU,hp,T=>{T.box(2,0,20,hp,0,4,2,'#56606c');T.rel(2,0,20,hp,(a,b,i,j)=>j%8<2?-1.2:0);T.teinte(2,hp-10,20,5,'#c8a820');for(let q=2;q<22;q+=8)T.teinte(q,hp-10,4,5,'#20242a')},{pas:10})}}
function coteDebut(N,o){o=o||{};spritesCote();portes(N);for(const ob of N.objets){ob.vu=false;if(ob.k==='porte'){ob.ouv=0;ob.ouverte=false;for(let q=0;q<ob.h;q++)N.G.g[ob.y+q][ob.x]='D'}}
  const d=o.x?[+o.x,N.depart[1]]:N.depart;
  S={t:0,N,j:joueurNouveau(d[0]*TU+12,d[1]*TU),cam:{x:0,y:0},vies:3,pouss:[],motes:ambianceNouv(46),proche:null,ckp:d.slice(),glitch:0,flash:0,flashC:'229,40,60',secousse:0,reinit:false,pause:false,fini:false,dialogue:false,amb:N.amb||'calme',q:[],friables:{},maxX:0};
  if(o.x)for(const ob of N.objets)if(ob.k==='zone'&&ob.x<+o.x)ob.vu=true;
  camSuit(N,S.cam,S.j,0,true);N.friable=(tx,ty)=>{const k=tx+','+ty;if(!S.friables[k])S.friables[k]={t:0,tx,ty}}}
const dans=(j,o)=>j.x+JL>o.x*TU&&j.x-JL<(o.x+o.w)*TU&&j.y>o.y*TU&&j.y-JH<(o.y+o.h)*TU;
const actif=(o,t)=>!o.per||((t+(o.dec||0))%o.per)<o.dur;
function coteDegat(retour){const j=S.j;if(j.inv>0||AUTO)return;S.vies--;S.flash=.35;S.secousse=.3;sfx.touche();vibre(120);j.inv=1.8;j.vy=-260;
  if(retour||S.vies<=0){j.x=S.ckp[0]*TU+12;j.y=S.ckp[1]*TU;j.vx=j.vy=0}
  if(S.vies<=0){S.pause=true;const N=S.N;if(S.reinit){S.vies=3;setTimeout(()=>{S.pause=false},700);aria('Réinitialisation indisponible. Reprise au point de contrôle.')}
    else reinitPage(()=>{S.reinit=true;S.vies=3;S.pause=false;aria('Réinitialisation terminée. Tu vois ? Tu peux me faire confiance.')},()=>{S.vies=3;S.pause=false})}}
function ouvrePorte(id){for(const o of S.N.objets)if(o.k==='porte'&&o.id===id&&!o.ouverte){o.ouverte=true;sfx.porte();for(let q=0;q<o.h;q++)S.N.G.g[o.y+q][o.x]='.'}}
function coteMaj(dt){const N=S.N,j=S.j;S.t+=dt;S.flash=Math.max(0,S.flash-dt);S.glitch=Math.max(0,S.glitch-dt);S.secousse=Math.max(0,S.secousse-dt);
  for(let i=S.q.length-1;i>=0;i--)if(S.q[i][0]<=S.t){const f=S.q[i][1];S.q.splice(i,1);f();if(!S||S.fini)return}
  const c=cmdLire();if(AUTO)c.dx=1;if(S.gel)c.dx=0,c.saut=false;majJoueur(N,j,dt,c);camSuit(N,S.cam,j,dt);S.maxX=Math.max(S.maxX,j.x);
  S.proche=null;let dm=40;
  for(const o of N.objets){
    if(o.k==='zone'){if(!o.vu&&j.x>o.x*TU&&(o.y0===undefined||(j.y>o.y0*TU&&j.y<=o.y1*TU))){o.vu=true;o.f(o)}}
    else if(o.k==='inter'){if(o.vu&&o.une)continue;const d=Math.hypot(j.x-(o.x*TU+12),(j.y-20)-(o.y*TU-12));if(d<dm){dm=d;S.proche=o}}
    else if(o.k==='porte'){if(o.ouverte&&o.ouv<1)o.ouv=Math.min(1,o.ouv+dt*1.4)}
    else if(o.k==='ckp'){if(!o.vu&&j.x>o.x*TU){o.vu=true;S.ckp=[o.x,o.y]}}
    else if(actif(o,S.t)&&dans(j,o))coteDegat(o.k==='pic')}
  for(const k in S.friables){const f=S.friables[k];f.t+=dt;if(f.t>.45&&!f.tombe){f.tombe=1;N.G.g[f.ty][f.tx]='.';sfx.chute();for(let i=0;i<6;i++)S.pouss.push({x:f.tx*TU+rnd()*TU,y:f.ty*TU,vx:(rnd()-.5)*30,vy:rnd()*60,l:.6,c:'#6a5a48'})}if(f.t>4){N.G.g[f.ty][f.tx]='~';delete S.friables[k]}}
  if(j.y>N.Hp+60)coteDegat(true);
  for(const p of S.pouss){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g===undefined?200:p.g)*dt;p.l-=dt}S.pouss=S.pouss.filter(p=>p.l>0);
  if(N.maj)N.maj(dt)}
function coteAct(){const o=S.proche;if(!o||S.pause||S.dialogue)return;o.vu=true;sfx.bip();o.f(o)}
function coteHud(){viesHud(S.vies);const b=$('act'),o=S.proche;b.style.visibility=o?'visible':'hidden';if(o)b.textContent=o.lib;if(S.N.hud)S.N.hud()}
function coteDessine(){const N=S.N,j=S.j,cmx=R(S.cam.x),cmy=R(S.cam.y+(N.Hp<H?N.Hp-H:0)),t=S.t;
  cx.save();if(S.secousse>0)cx.translate(R((rnd()-.5)*8*Math.min(1,S.secousse*3)),R((rnd()-.5)*8*Math.min(1,S.secousse*3)));
  cx.drawImage(N.fondLoin,-R(cmx*.12)%240,0);
  if(N.dessineLoin)N.dessineLoin(cmx,cmy);
  poseBandes(N.decor,cmx,cmy);
  // tuiles friables tombées : cache
  for(const k in S.friables){const f=S.friables[k];if(f.tombe){cx.fillStyle='rgba(8,10,16,.82)';cx.fillRect(f.tx*TU-cmx,f.ty*TU-cmy,TU,7)}else{cx.fillStyle='rgba(255,220,160,'+(.3*Math.sin(t*40)+.3)+')';cx.fillRect(f.tx*TU-cmx,f.ty*TU-cmy+(rnd()*2|0),TU,2)}}
  for(const o of N.objets){const ox=o.x*TU-cmx,oy=o.y*TU-cmy;if(ox<-200||ox>W+200)continue;
    if(o.k==='porte'){if(o.ouv<1){const hp=o.h*TU,v=R(hp*(1-o.ouv));cx.drawImage(o.sp,0,hp-v,TU,v,ox,oy,TU,v)}}
    else if(o.k==='inter'){if(o.sp&&!(o.vu&&o.cache)){const s=typeof o.sp==='function'?o.sp(o):o.sp;cx.drawImage(s,R(ox+12-s.width/2),R(oy-s.height-(o.dy||0)))}}
    else if(o.k==='arc'){if(actif(o,t)){cx.strokeStyle='#bff6ff';cx.lineWidth=2;cx.beginPath();for(let q=0;q<3;q++){let x=ox+rnd()*o.w*TU,y=oy+o.h*TU;cx.moveTo(x,y);for(let s=0;s<5;s++){x+=(rnd()-.5)*18;y-=o.h*TU/5;cx.lineTo(x,y)}}cx.stroke();cx.strokeStyle='#3FD6E6';cx.lineWidth=1;cx.stroke();if(rnd()<.3)S.pouss.push({x:o.x*TU+rnd()*o.w*TU,y:(o.y+o.h)*TU,vx:(rnd()-.5)*120,vy:-rnd()*160,l:.3,c:'#eaffff'});if(rnd()<.04)sfx.elec()}
      else if(((t+(o.dec||0))%o.per)>o.per-.5&&rnd()<.5){cx.fillStyle='#eaffff';cx.fillRect(ox+rnd()*o.w*TU,oy+o.h*TU-3,2,2)}}
    else if(o.k==='vap'){if(actif(o,t)){for(let q=0;q<3;q++)S.pouss.push({x:(o.x+o.w/2)*TU+(rnd()-.5)*8,y:(o.y+o.h)*TU,vx:(rnd()-.5)*26,vy:-o.h*TU*1.5-rnd()*40,l:.6,c:'v',g:0})}else if(rnd()<.1)S.pouss.push({x:(o.x+o.w/2)*TU,y:(o.y+o.h)*TU,vx:(rnd()-.5)*10,vy:-30,l:.4,c:'v',g:0})}}
  if(N.dessineAvant)N.dessineAvant(cmx,cmy);
  // joueur
  if(!S.cacheJoueur&&(j.inv<=0||Math.floor(j.inv*14)%2))poseSprite(imageJoueur(N.persoJ||SPC.op,j),j.x-cmx,j.y-cmy,j.dir);
  for(const p of S.pouss){if(p.c==='v'){cx.fillStyle='rgba(215,225,235,'+Math.min(.5,p.l)+')';const s=R(10-p.l*8);cx.fillRect(R(p.x-cmx-s/2),R(p.y-cmy-s/2),s,s)}else{cx.fillStyle=p.c;cx.fillRect(R(p.x-cmx),R(p.y-cmy),2,2)}}
  // éclairage
  lumDebut(N.ambCol||N.Th.amb);
  for(const[lx,ly,c,pas]of N.lampes||[]){const x=lx*TU+12-cmx,y=ly*TU+24-cmy;if(x<-220||x>W+220)continue;const fl=pas&&Math.sin(t*23+lx)*Math.sin(t*7.3+lx)>.3?.35:1;lumPoint(x,y+40,300,c||'#ffd9a0',fl)}
  for(const[fx,fy,fw,fh]of N.fenetres||[]){const x=(fx+fw/2)*TU-cmx,y=(fy+fh/2)*TU-cmy;if(x<-260||x>W+260)continue;lumPoint(x,y,Math.max(fw,fh)*TU*1.7,'#8fa6d8',.75);lumPoint(x+fh*TU*.5,y+fh*TU*1.1,fw*TU*2.6,'#8fa6d8',.4)}
  if(!S.cacheJoueur){lumPoint(j.x-cmx+j.dir*34,j.y-cmy-30,170,'#bfeeff',.8);lumPoint(j.x-cmx,j.y-cmy-22,90,'#dff6ff',.6)}
  for(const o of N.objets){if(o.k==='inter'&&o.lueur&&!(o.vu&&o.une))lumPoint(o.x*TU+12-cmx,o.y*TU-10-cmy,70,o.lueur,.6+.3*Math.sin(t*4));if(o.k==='arc'&&actif(o,t))lumPoint((o.x+o.w/2)*TU-cmx,(o.y+o.h/2)*TU-cmy,150,'#9feaff',.9)}
  if(N.lumieres)N.lumieres(cmx,cmy);
  lumFin();
  // rayons de lune, poussières, marqueur d'interaction
  cx.globalCompositeOperation='lighter';for(const[fx,fy,fw,fh,st]of N.fenetres||[]){if(st==='trou'&&!N.rayonsTrou)continue;const x=fx*TU-cmx,y=(fy+fh)*TU-cmy,w=fw*TU,L=260;if(x<-400||x>W+100)continue;const g=cx.createLinearGradient(0,y-fh*TU,0,y+L);g.addColorStop(0,'rgba(150,175,235,.13)');g.addColorStop(1,'rgba(150,175,235,0)');cx.fillStyle=g;cx.beginPath();cx.moveTo(x,y-fh*TU);cx.lineTo(x+w,y-fh*TU);cx.lineTo(x+w+L*.55,y+L);cx.lineTo(x+L*.55-20,y+L);cx.fill()}cx.globalCompositeOperation='source-over';
  ambianceDessine(S.motes,t,1/60);
  if(N.dessineApres)N.dessineApres(cmx,cmy);
  if(S.proche){const o=S.proche,x=o.x*TU+12-cmx,y=o.y*TU-34-cmy-(o.dy||0)+Math.sin(t*5)*2;cx.fillStyle='#3FD6E6';cx.fillRect(R(x-1),R(y-8),3,7);cx.fillRect(R(x-1),R(y+1),3,3)}
  // premier plan sombre (parallaxe)
  if(N.avant!==false){cx.fillStyle='#04060a';for(let i=0;i<8;i++){const x=R(i*520+210-cmx*1.35);if(x<-40||x>W+10)continue;cx.fillRect(x,0,16,H);cx.fillRect(x-5,R(H*.2),26,5);cx.fillRect(x-5,R(H*.62),26,5)}
    for(let i=0;i<10;i++){const x=R(i*410+70-cmx*1.2),l=90+(i*53)%120;if(x<-10||x>W+10)continue;for(let y=0;y<l;y+=6)cx.fillRect(x+(y%12?0:1),y,2,4);cx.fillRect(x-3,l,8,6)}}
  cx.restore();
  poseVoile(false);

function accessible(N){const G=N.G,ok=(x,y)=>!plein(G.get(x,y-1))&&!plein(G.get(x,y-2))&&(plein(G.get(x,y))||G.get(x,y)==='='||G.get(x,y)==='~')&&G.get(x,y)!=='D'&&x>=0&&x<G.c,vu=new Set(),f=[[N.depart[0],N.depart[1]]];vu.add(f[0].join());

  while(f.length){const[x,y]=f.pop();for(let dx=-4;dx<=4;dx++)for(let ny=y-3;ny<G.r;ny++){const nx=x+dx;if(!ok(nx,ny)||vu.has(nx+','+ny))continue;const up=y-ny,ad=Math.abs(dx);
