<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerveau NB — Visualiseur</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#07060b;--deep:#0c0a14;--panel:rgba(14,12,22,0.92);
  --synapse:#1a1428;--membrane:rgba(120,80,200,0.08);
  --axon:#6b3fa0;--dendrite:#3a8f8f;--soma:#c4a0ff;
  --fire:#ff6b4a;--memory:#4a9eff;--emotion:#ff4a8d;--pattern:#4aff8b;
  --word:#ffb74a;--concept:#a78bfa;
  --text:#c8c0d8;--text-dim:#5a5268;--text-bright:#ede8f5;
  --glow-axon:rgba(107,63,160,0.4);--glow-fire:rgba(255,107,74,0.6);
  --serif:'Cormorant Garamond',Georgia,serif;
  --mono:'DM Mono','Courier New',monospace;
}
html,body{height:100%;overflow:hidden;background:var(--void);color:var(--text);font-family:var(--mono);font-size:13px}

/* === NEURAL BACKGROUND === */
.neural-bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.neural-bg canvas{width:100%;height:100%}

/* === LAYOUT === */
.app{position:relative;z-index:1;display:grid;grid-template-columns:320px 1fr;grid-template-rows:auto 1fr;height:100vh;gap:0}
.header{grid-column:1/-1;padding:20px 28px 16px;border-bottom:1px solid var(--membrane);background:var(--panel);backdrop-filter:blur(20px);display:flex;align-items:baseline;gap:24px}
.header h1{font-family:var(--serif);font-weight:300;font-size:28px;color:var(--soma);letter-spacing:1px}
.header h1 em{font-style:italic;color:var(--axon);font-weight:600}
.header .pulse{width:8px;height:8px;border-radius:50%;background:var(--fire);animation:pulse 2s ease-in-out infinite;margin-left:-16px;margin-bottom:2px}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 4px var(--fire)}50%{opacity:0.3;box-shadow:0 0 12px var(--fire)}}
.stats-bar{display:flex;gap:20px;margin-left:auto;align-items:baseline}
.stat{display:flex;flex-direction:column;align-items:center}
.stat-val{font-size:20px;font-weight:500;color:var(--text-bright);font-family:var(--serif);font-weight:600}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--text-dim);margin-top:2px}

/* === SIDEBAR === */
.sidebar{overflow-y:auto;border-right:1px solid var(--membrane);background:var(--panel);backdrop-filter:blur(16px);padding:0}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--axon);border-radius:2px}
.section{padding:16px 20px;border-bottom:1px solid var(--membrane)}
.section-title{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--soma);margin-bottom:12px;letter-spacing:0.5px}

/* Type distribution */
.type-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-bottom:8px;background:var(--synapse)}
.type-bar div{height:100%;transition:width 0.6s ease}
.type-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px}
.type-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.type-count{margin-left:auto;color:var(--text-dim)}

/* Search */
.search-box{width:100%;background:var(--synapse);border:1px solid var(--membrane);color:var(--text);padding:8px 12px;border-radius:4px;font-family:var(--mono);font-size:12px;outline:none;transition:border 0.3s}
.search-box:focus{border-color:var(--axon)}
.search-box::placeholder{color:var(--text-dim)}

/* Node list */
.node-list{max-height:300px;overflow-y:auto}
.node-item{padding:6px 0;border-bottom:1px solid rgba(120,80,200,0.04);cursor:pointer;transition:background 0.2s}
.node-item:hover{background:rgba(120,80,200,0.06)}
.node-item .content{font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.node-item .meta{font-size:9px;color:var(--text-dim);margin-top:2px;display:flex;gap:8px}
.node-item .type-badge{font-size:9px;padding:1px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:1px}

/* Curiosity log */
.curiosity-item{padding:6px 0;border-bottom:1px solid rgba(120,80,200,0.04);font-size:11px}
.curiosity-item .topic{color:var(--dendrite);font-weight:500}
.curiosity-item .time{color:var(--text-dim);font-size:9px}

/* === MAIN CANVAS === */
.canvas-wrap{position:relative;overflow:hidden;background:var(--void)}
#graph-canvas{width:100%;height:100%;cursor:grab}
#graph-canvas:active{cursor:grabbing}

/* Tooltip */
.tooltip{position:fixed;z-index:100;padding:10px 14px;background:var(--panel);border:1px solid var(--axon);border-radius:6px;backdrop-filter:blur(16px);pointer-events:none;opacity:0;transition:opacity 0.15s;max-width:300px}
.tooltip.visible{opacity:1}
.tooltip .tt-title{font-family:var(--serif);font-size:14px;color:var(--soma);margin-bottom:4px}
.tooltip .tt-type{font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.tooltip .tt-content{font-size:11px;color:var(--text);line-height:1.4}
.tooltip .tt-meta{font-size:9px;color:var(--text-dim);margin-top:6px}

/* Controls */
.controls{position:absolute;bottom:20px;right:20px;display:flex;gap:8px}
.ctrl-btn{width:36px;height:36px;border-radius:6px;border:1px solid var(--membrane);background:var(--panel);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);transition:all 0.2s}
.ctrl-btn:hover{border-color:var(--axon);color:var(--soma)}
.view-label{position:absolute;bottom:24px;left:20px;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px}

/* Loading */
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--void);z-index:50}
.loading-text{font-family:var(--serif);font-size:22px;color:var(--axon);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:0.4}50%{opacity:1}}

/* Chat */
.chat-section{position:absolute;bottom:20px;left:20px;right:160px;z-index:10}
.chat-input{width:100%;background:var(--panel);border:1px solid var(--membrane);color:var(--text);padding:10px 14px;border-radius:6px;font-family:var(--mono);font-size:12px;outline:none;backdrop-filter:blur(16px);transition:border 0.3s}
.chat-input:focus{border-color:var(--axon)}
.chat-input::placeholder{color:var(--text-dim)}
.chat-response{margin-bottom:8px;padding:10px 14px;background:var(--panel);border:1px solid var(--membrane);border-radius:6px;backdrop-filter:blur(16px);font-size:12px;line-height:1.5;color:var(--text-bright);max-height:120px;overflow-y:auto;display:none}
.chat-response.visible{display:block}
</style>
</head>
<body>

<div class="tooltip" id="tooltip">
  <div class="tt-title"></div>
  <div class="tt-type"></div>
  <div class="tt-content"></div>
  <div class="tt-meta"></div>
</div>

<div class="loading" id="loading">
  <span class="loading-text">Le cerveau se reveille...</span>
</div>

<div class="app">
  <header class="header">
    <h1>Cerveau <em>NB</em></h1>
    <div class="pulse"></div>
    <div class="stats-bar">
      <div class="stat"><span class="stat-val" id="s-nodes">—</span><span class="stat-label">noeuds</span></div>
      <div class="stat"><span class="stat-val" id="s-edges">—</span><span class="stat-label">aretes</span></div>
      <div class="stat"><span class="stat-val" id="s-emotion">—</span><span class="stat-label">emotion</span></div>
    </div>
  </header>

  <aside class="sidebar">
    <div class="section">
      <div class="section-title">Distribution</div>
      <div class="type-bar" id="type-bar"></div>
      <div id="type-rows"></div>
    </div>
    <div class="section">
      <div class="section-title">Chercher</div>
      <input class="search-box" id="search" type="text" placeholder="Taper un mot...">
    </div>
    <div class="section">
      <div class="section-title">Noeuds</div>
      <div class="node-list" id="node-list"></div>
    </div>
    <div class="section">
      <div class="section-title">Curiosite</div>
      <div id="curiosity-log"></div>
    </div>
  </aside>

  <main class="canvas-wrap">
    <canvas id="graph-canvas"></canvas>
    <div class="chat-section">
      <div class="chat-response" id="chat-response"></div>
      <input class="chat-input" id="chat-input" type="text" placeholder="Parler au cerveau...">
    </div>
    <div class="view-label">Force-directed graph</div>
    <div class="controls">
      <button class="ctrl-btn" id="btn-zoom-in" title="Zoom in">+</button>
      <button class="ctrl-btn" id="btn-zoom-out" title="Zoom out">-</button>
      <button class="ctrl-btn" id="btn-reset" title="Reset">R</button>
    </div>
  </main>
</div>

<script>
// Auto-detect: local server or static file
const HAS_SERVER = location.port === '8082';
const API = HAS_SERVER ? 'http://127.0.0.1:8082' : '';
const TYPE_COLORS = {
  concept: '#a78bfa', word: '#ffb74a', memory: '#4a9eff',
  emotion: '#ff4a8d', pattern: '#4aff8b',
};

let graphData = { nodes: [], edges: [] };
let positions = {};
let velocities = {};
let zoom = 1, panX = 0, panY = 0;
let dragging = null, dragStart = null, panStart = null;
let hoveredNode = null;
let selectedNode = null;
let searchTerm = '';

const canvas = document.getElementById('graph-canvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

// === DATA FETCHING ===
async function loadBrain() {
  try {
    let graph, curiosityRes;
    if (HAS_SERVER) {
      [graph, curiosityRes] = await Promise.all([
        fetch(`${API}/api/graph`).then(r => r.json()),
        fetch(`${API}/api/curiosity`).catch(() => null)
      ]);
    } else {
      // Static mode: load from JSON file
      graph = await fetch('brain_data.json').then(r => r.json());
      curiosityRes = await fetch('curiosity_log.json').catch(() => null);
    }
    // Filter: keep only nodes with connections (top 300 most connected)
    const edgeCount = {};
    graph.edges.forEach(e => {
      edgeCount[e.source] = (edgeCount[e.source] || 0) + 1;
      edgeCount[e.target] = (edgeCount[e.target] || 0) + 1;
    });
    const sortedNodes = [...graph.nodes].sort((a,b) => (edgeCount[b.id]||0) - (edgeCount[a.id]||0));
    const MAX_DISPLAY = 300;
    const displayNodes = sortedNodes.slice(0, MAX_DISPLAY);
    const displayIds = new Set(displayNodes.map(n => n.id));
    const displayEdges = graph.edges.filter(e => displayIds.has(e.source) && displayIds.has(e.target));

    graphData = { nodes: displayNodes, edges: displayEdges, stats: graph.stats };

    // Init positions (force layout)
    const N = displayNodes.length;
    displayNodes.forEach((n, i) => {
      const angle = (i / N) * Math.PI * 2;
      const r = 150 + Math.random() * 250;
      positions[n.id] = { x: Math.cos(angle) * r, y: Math.sin(angle) * r };
      velocities[n.id] = { x: 0, y: 0 };
    });

    // Update stats
    document.getElementById('s-nodes').textContent = graph.stats?.nodes || graph.nodes.length;
    document.getElementById('s-edges').textContent = graph.stats?.edges || graph.edges.length;
    document.getElementById('s-emotion').textContent = graph.stats?.dominant_emotion || 'neutre';

    // Type distribution
    updateTypeDistribution(graph);
    updateNodeList(graph.nodes);

    // Curiosity
    if (curiosityRes) {
      try {
        const curiosity = await curiosityRes.json();
        updateCuriosity(curiosity);
      } catch(e) {}
    }

    document.getElementById('loading').style.display = 'none';
    runForceLayout();
  } catch(e) {
    document.querySelector('.loading-text').textContent = 'Erreur: lancer server.py d\'abord';
    console.error(e);
  }
}

function updateTypeDistribution(graph) {
  const counts = {};
  graph.nodes.forEach(n => { counts[n.type] = (counts[n.type] || 0) + 1; });
  const total = graph.nodes.length || 1;
  const bar = document.getElementById('type-bar');
  const rows = document.getElementById('type-rows');
  bar.innerHTML = '';
  rows.innerHTML = '';
  for (const [type, count] of Object.entries(counts).sort((a,b) => b[1]-a[1])) {
    const pct = (count / total * 100).toFixed(1);
    const color = TYPE_COLORS[type] || '#666';
    bar.innerHTML += `<div style="width:${pct}%;background:${color}"></div>`;
    rows.innerHTML += `<div class="type-row"><span class="type-dot" style="background:${color}"></span>${type}<span class="type-count">${count} (${pct}%)</span></div>`;
  }
}

function updateNodeList(nodes) {
  const list = document.getElementById('node-list');
  const filtered = searchTerm
    ? nodes.filter(n => n.content.toLowerCase().includes(searchTerm.toLowerCase()))
    : nodes.slice(0, 80);
  list.innerHTML = filtered.slice(0, 80).map(n => {
    const color = TYPE_COLORS[n.type] || '#666';
    return `<div class="node-item" data-id="${n.id}">
      <span class="type-badge" style="background:${color}22;color:${color}">${n.type}</span>
      <div class="content">${escHtml(n.content)}</div>
      <div class="meta"><span>act: ${n.activation}</span></div>
    </div>`;
  }).join('');

  list.querySelectorAll('.node-item').forEach(el => {
    el.addEventListener('click', () => {
      selectedNode = el.dataset.id;
      centerOnNode(el.dataset.id);
    });
  });
}

function updateCuriosity(log) {
  const el = document.getElementById('curiosity-log');
  const recent = log.slice(-10).reverse();
  el.innerHTML = recent.map(l =>
    `<div class="curiosity-item"><span class="topic">${escHtml(l.topic)}</span> <span class="time">${l.time || ''}</span></div>`
  ).join('') || '<div style="color:var(--text-dim);font-size:11px">Aucune exploration</div>';
}

function escHtml(s) { return s.replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// === FORCE LAYOUT ===
let layoutRunning = true;
let layoutIterations = 0;

function runForceLayout() {
  if (!layoutRunning || layoutIterations > 300) return;
  layoutIterations++;

  const nodes = graphData.nodes;
  const edges = graphData.edges;
  const N = nodes.length;
  if (N === 0) return;

  // Repulsion — sample-based for performance (check ~20% of pairs per frame)
  const k = 90;
  const sampleRate = Math.max(1, Math.floor(N * 0.2));
  for (let i = 0; i < N; i++) {
    const a = nodes[i];
    const pa = positions[a.id];
    if (!pa) continue;
    // Compare against random sample instead of all
    for (let s = 0; s < sampleRate; s++) {
      const j = Math.floor(Math.random() * N);
      if (j === i) continue;
      const b = nodes[j];
      const pb = positions[b.id];
      if (!pb) continue;
      let dx = pa.x - pb.x, dy = pa.y - pb.y;
      let d = Math.sqrt(dx*dx + dy*dy) || 1;
      if (d > 400) continue;
      const force = (k * k) / d;
      const fx = (dx/d) * force * 0.015;
      const fy = (dy/d) * force * 0.015;
      velocities[a.id].x += fx;
      velocities[a.id].y += fy;
      velocities[b.id].x -= fx;
      velocities[b.id].y -= fy;
    }
  }

  // Attraction (edges)
  const idealLen = 50;
  edges.forEach(e => {
    const pa = positions[e.source], pb = positions[e.target];
    if (!pa || !pb) return;
    let dx = pb.x - pa.x, dy = pb.y - pa.y;
    let d = Math.sqrt(dx*dx + dy*dy) || 1;
    const force = (d - idealLen) * 0.005 * (e.weight || 0.1);
    const fx = (dx/d) * force;
    const fy = (dy/d) * force;
    if (velocities[e.source]) { velocities[e.source].x += fx; velocities[e.source].y += fy; }
    if (velocities[e.target]) { velocities[e.target].x -= fx; velocities[e.target].y -= fy; }
  });

  // Apply velocities with damping
  const damping = 0.82;
  let totalMovement = 0;
  nodes.forEach(n => {
    const v = velocities[n.id];
    const p = positions[n.id];
    if (!v || !p || n.id === dragging) return;
    v.x *= damping; v.y *= damping;
    const speed = Math.sqrt(v.x*v.x + v.y*v.y);
    if (speed > 8) { v.x = (v.x/speed)*8; v.y = (v.y/speed)*8; }
    p.x += v.x; p.y += v.y;
    totalMovement += speed;
  });

  render();

  if (totalMovement > 0.3 || layoutIterations < 150) {
    requestAnimationFrame(runForceLayout);
  } else {
    layoutRunning = false;
  }
}

// === RENDERING ===
function render() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.parentElement.clientWidth;
  const h = canvas.parentElement.clientHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.fillStyle = 'rgba(7,6,11,1)';
  ctx.fillRect(0, 0, w, h);

  ctx.save();
  ctx.translate(w/2 + panX, h/2 + panY);
  ctx.scale(zoom, zoom);

  // Draw edges
  graphData.edges.forEach(e => {
    const pa = positions[e.source], pb = positions[e.target];
    if (!pa || !pb) return;
    const alpha = Math.min(0.5, e.weight * 0.8);
    const highlighted = selectedNode && (e.source === selectedNode || e.target === selectedNode);
    ctx.beginPath();
    ctx.moveTo(pa.x, pa.y);
    ctx.lineTo(pb.x, pb.y);
    ctx.strokeStyle = highlighted
      ? `rgba(167,139,250,${Math.min(0.8, alpha + 0.4)})`
      : `rgba(107,63,160,${alpha})`;
    ctx.lineWidth = highlighted ? 1.5 : 0.5;
    ctx.stroke();
  });

  // Draw nodes
  const nodeMap = {};
  graphData.nodes.forEach(n => nodeMap[n.id] = n);

  graphData.nodes.forEach(n => {
    const p = positions[n.id];
    if (!p) return;
    const color = TYPE_COLORS[n.type] || '#666';
    const isHovered = hoveredNode === n.id;
    const isSelected = selectedNode === n.id;
    const isConnected = selectedNode && graphData.edges.some(
      e => (e.source === selectedNode && e.target === n.id) || (e.target === selectedNode && e.source === n.id)
    );
    const dimmed = selectedNode && !isSelected && !isConnected;

    // Size based on connections
    const edgeCount = graphData.edges.filter(e => e.source === n.id || e.target === n.id).length;
    const baseR = 2 + Math.min(6, Math.sqrt(edgeCount) * 0.8);
    const r = isHovered || isSelected ? baseR + 2 : baseR;

    // Glow
    if (isSelected || isHovered) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, r + 8, 0, Math.PI * 2);
      const grad = ctx.createRadialGradient(p.x, p.y, r, p.x, p.y, r + 8);
      grad.addColorStop(0, color + '44');
      grad.addColorStop(1, color + '00');
      ctx.fillStyle = grad;
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = dimmed ? color + '33' : color;
    ctx.fill();

    // Label for selected/hovered or high-edge nodes
    if ((isSelected || isHovered || (edgeCount > 15 && zoom > 0.6)) && !dimmed) {
      const label = n.content.split(':')[0].substring(0, 25);
      ctx.font = `${isSelected ? '500' : '400'} 10px "DM Mono"`;
      ctx.fillStyle = dimmed ? '#33303d' : '#c8c0d8';
      ctx.textAlign = 'center';
      ctx.fillText(label, p.x, p.y - r - 5);
    }
  });

  ctx.restore();
}

// === INTERACTION ===
function getNodeAt(mx, my) {
  const w = canvas.parentElement.clientWidth;
  const h = canvas.parentElement.clientHeight;
  const gx = (mx - w/2 - panX) / zoom;
  const gy = (my - h/2 - panY) / zoom;
  let closest = null, closestDist = 15 / zoom;
  graphData.nodes.forEach(n => {
    const p = positions[n.id];
    if (!p) return;
    const d = Math.sqrt((p.x-gx)**2 + (p.y-gy)**2);
    if (d < closestDist) { closest = n; closestDist = d; }
  });
  return closest;
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;

  if (dragging) {
    const w = canvas.parentElement.clientWidth;
    const h = canvas.parentElement.clientHeight;
    positions[dragging].x = (mx - w/2 - panX) / zoom;
    positions[dragging].y = (my - h/2 - panY) / zoom;
    if (!layoutRunning) { layoutRunning = true; layoutIterations = 500; runForceLayout(); }
    return;
  }

  if (panStart) {
    panX = panStart.px + (e.clientX - panStart.x);
    panY = panStart.py + (e.clientY - panStart.y);
    render();
    return;
  }

  const node = getNodeAt(mx, my);
  hoveredNode = node?.id || null;

  if (node) {
    tooltip.querySelector('.tt-title').textContent = node.content.split(':')[0].substring(0, 50);
    tooltip.querySelector('.tt-type').textContent = node.type;
    tooltip.querySelector('.tt-type').style.color = TYPE_COLORS[node.type] || '#666';
    tooltip.querySelector('.tt-content').textContent = node.content.substring(0, 200);
    tooltip.querySelector('.tt-meta').textContent = `activation: ${node.activation}`;
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY - 10) + 'px';
    tooltip.classList.add('visible');
    canvas.style.cursor = 'pointer';
  } else {
    tooltip.classList.remove('visible');
    canvas.style.cursor = 'grab';
  }
  render();
});

canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const node = getNodeAt(mx, my);
  if (node) {
    dragging = node.id;
    selectedNode = node.id;
    canvas.style.cursor = 'grabbing';
  } else {
    panStart = { x: e.clientX, y: e.clientY, px: panX, py: panY };
    selectedNode = null;
  }
  render();
});

canvas.addEventListener('mouseup', () => {
  dragging = null;
  panStart = null;
  canvas.style.cursor = 'grab';
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  zoom = Math.max(0.05, Math.min(5, zoom * factor));
  render();
}, { passive: false });

canvas.addEventListener('dblclick', () => {
  selectedNode = null;
  render();
});

// Controls
document.getElementById('btn-zoom-in').addEventListener('click', () => { zoom *= 1.3; render(); });
document.getElementById('btn-zoom-out').addEventListener('click', () => { zoom *= 0.7; render(); });
document.getElementById('btn-reset').addEventListener('click', () => { zoom = 1; panX = 0; panY = 0; selectedNode = null; render(); });

// Search
document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value;
  updateNodeList(graphData.nodes);
  // Highlight matching nodes
  if (searchTerm.length > 1) {
    const match = graphData.nodes.find(n => n.content.toLowerCase().includes(searchTerm.toLowerCase()));
    if (match) { selectedNode = match.id; centerOnNode(match.id); }
  } else {
    selectedNode = null;
  }
  render();
});

function centerOnNode(id) {
  const p = positions[id];
  if (!p) return;
  panX = -p.x * zoom;
  panY = -p.y * zoom;
  render();
}

// Chat
const chatInput = document.getElementById('chat-input');
const chatResponse = document.getElementById('chat-response');

chatInput.addEventListener('keydown', async e => {
  if (e.key !== 'Enter' || !chatInput.value.trim()) return;
  const msg = chatInput.value.trim();
  chatInput.value = '';
  chatResponse.textContent = 'Reflexion...';
  chatResponse.classList.add('visible');

  try {
    const res = await fetch(`${API}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg }),
    });
    const data = await res.json();
    chatResponse.textContent = data.response || 'Silence.';

    // Reload graph to show activations
    const graphRes = await fetch(`${API}/api/graph`);
    const newGraph = await graphRes.json();
    // Update activations
    newGraph.nodes.forEach(n => {
      const existing = graphData.nodes.find(e => e.id === n.id);
      if (existing) existing.activation = n.activation;
    });
    document.getElementById('s-emotion').textContent = newGraph.stats?.dominant_emotion || 'neutre';
    render();
  } catch(err) {
    chatResponse.textContent = 'Erreur: ' + err.message;
  }
});

// === INIT ===
if (!HAS_SERVER) {
  document.querySelector('.chat-section').style.display = 'none';
}
window.addEventListener('resize', render);
loadBrain();
</script>
</body>
</html>
